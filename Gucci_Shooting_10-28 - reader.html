<script>
const DATA = {"title":"The Gucci Diaries","script":"Gucci_Shooting_10-28.pdf","revision":"Shooting script 10-28","built":"2026-10-31","cast":[{"name":"JULIAN","who":"Narrator (V.O. and to camera). Eldest Weiss child, 13 in 1968, about 20 in 1975. Sells at Gucci, says he's 25."},{"name":"YOUNG JULIAN","who":"Julian at 13 on the night of the fire, in flashbacks."},{"name":"ANDREW","who":"Julian's youngest brother, 3, who idolises him. Dies in the 1968 house fire."},{"name":"JOANIE","who":"Julian's sister, 10 in 1968 (17 later). Sharp-tongued, calls Julian 'the golden boy'."},{"name":"FRED","who":"Julian's brother, 7 in 1968 (14 later). Remembers everything."},{"name":"JENNIFER","who":"Jennifer Smith, the Westbury neighbour who helped with the kids. Calls Julian 'Roo'. He spends the film looking for her."},{"name":"BARBARA","who":"Julian's mother, late 30s, a legal secretary and a worrier. Burns her hand trying to reach Andrew."},{"name":"LENNY","who":"Julian's father, 40s, makes knockoff designer shirts. Julian's hero. Wants Julian to take over the business."},{"name":"ADAM","who":"Next-door neighbour in Encino, 12 then 20. Julian's friend from high school, the one outsider who knows about Gucci."},{"name":"AUNT RITA","who":"Barbara's sister. Sends the box of family photos and shot the 8mm film of Andrew's party."},{"name":"UNCLE MORTY","who":"Comes to the family deli dinner with Aunt Rita and tells her to stay out of it."},{"name":"MAURO","who":"Mauro Celoni, manager of Gucci Beverly Hills, from Milan. Hires Julian and flirts with him, later warns and mentors him."},{"name":"SPOON","who":"Gucci shoe salesman, Black, late 20s, a struggling comic who plays Detroit tough. Julian's best friend. Knows his real age."},{"name":"VICTORIA","who":"British Gucci colleague, 30s, wants to be a model, lives with her mum and grandmother. Hosts the party in the Hills."},{"name":"SOPHIA","who":"Gucci's top salesperson, Argentine, late 30s, a single mother. Resents Julian for taking her sales."},{"name":"COWBOY","who":"'Tex', a rich oil tycoon customer. Throws a champagne-and-cocaine spree in the Gucci VIP room and gets them into Pips."},{"name":"CANDACE","who":"Julian's girlfriend, 21, a UCLA art lover who wants to get engaged. Leaves him over his secrets."},{"name":"DAWN","who":"Julian's high-school classmate (prom night). They have a fling in the women's room at Pips."},{"name":"ANNA","who":"Texan, 42, an older woman Julian falls for at Pips. Co-hosts Victoria's party, then gently turns him down."},{"name":"ELIN","who":"Norwegian Playboy Playmate of the Year, 20s, a Gucci customer. Julian dates her, and she's with him in Paris."},{"name":"SCHOOL COUNSELOR","who":"UCLA campus counsellor Julian sees once, at Candace's urging. He walks out."},{"name":"OLDER EXECUTIVE","who":"Drunk executive at Pips who greets Julian as if he's somebody. One line."},{"name":"AIRPORT ANNOUNCER","who":"Off-screen voice calling the flight to Los Angeles in the epilogue."},{"name":"HUGH HEFNER","who":"'Hef', owner of Pips. Doesn't speak. Makes an entrance with his entourage."},{"name":"FIRE MARSHAL","who":"Doesn't speak. Shows Lenny the iron with a melted Pierre Cardin label, the cause of the fire."}],"scenes":[{"id":"1","page":"1","pages":"1","slug":"OPENING MONTAGE - TITLE SEQUENCE","ie":"","loc":"OPENING MONTAGE - TITLE SEQUENCE","time":"","omitted":false,"summary":"Stock and archival montage of 1968 America, from Manhattan's sanitation-strike trash to a Westbury welcome sign. Julian, in voice-over, recalls one of America's most turbulent years.","old":false,"lead":"","who":["Julian"],"el":[["trans","FADE IN:"],["action","\"Quality is remembered long after the price is forgotten.\""],["action","-Aldo Gucci"],["trans","DISSOLVE TO:"],["action","Montage of stock footage USA in 1968. Eventually we go from headlines and archival footage to maps and aerials that take us to Manhattan, New York Images of the sanitation strike trash pileups and a quick move across the Brooklyn Bridge past \"Flatbush\" to the \"burbs\" of WESTBURY NEW YORK, where a sign welcomes us."],["cue","JULIAN (V.O.)"],["dialogue","1968 - seems like forever ago. Looking back now, it really was one of the most turbulent years in American History. The news was filled with Vietnam and the anti war protests. Racial reckoning and the counterculture were creating mass social change like nothing America had ever seen before. We had just lost Martin Luther King and we would lose Bobby Kennedy later that summer."]]},{"id":"2","page":"1","pages":"1","slug":"EXT. WESTBURY, LONG ISLAND, NEW YORK - DAY","ie":"EXT","loc":"WESTBURY, LONG ISLAND, NEW YORK","time":"DAY","omitted":false,"summary":"As the titles end, we settle on a suburban Westbury home. Julian, off screen, says strike-hit New York stank and the family was lucky to have moved.","old":false,"lead":"","who":["Julian"],"el":[["action","We see tract homes that reflect the suburban American Dream. Moving over a cul de sac block we settle on a nice home with a '68 Ford Country Squire station wagon parked in the driveway and a basketball hoop on the street next to the driveway entrance."],["cue","JULIAN (O.S.)"],["dialogue","New York stunk that year. The Sanitation strike had left mountains of trash all over all five boroughs and the rat population exploded. Luckily, we had moved to Westbury, Long Island New York."],["note","(END TITLE SEQUENCE)"]]},{"id":"3","page":"1","pages":"1–2","slug":"EXT. WESTBURY, LONG ISLAND - FAMILY HOME - DAY","ie":"EXT","loc":"WESTBURY, LONG ISLAND - FAMILY HOME","time":"DAY","omitted":false,"summary":"Establishing stock footage of the family home. In voice-over, Julian explains how all six of them left a cramped Flatbush brownstone for the suburbs.","old":false,"lead":"","who":["Julian"],"el":[["action","Establishing shot. Stock footage montage."],["cue","JULIAN (V.O.)"],["dialogue","Westbury Hills to be precise. Talk about change.Ya see, after Joanie was born my family became part of the suburban exodus from Brooklyn. We left our cramped two bedroom one bathroom brownstone in Flatbush to pursue the American Dream - I mean, look around - manicured lawns, a backyard, a two car garage and a basketball hoop! And by “we,” I mean my family - all six of us!"]]},{"id":"3A","page":"2","pages":"2–4","slug":"INT. WESTBURY, LONG ISLAND FAMILY HOME - DAY","ie":"INT","loc":"WESTBURY, LONG ISLAND FAMILY HOME","time":"DAY","omitted":false,"summary":"In a few freeze-frame beats, Julian introduces Andrew, Joanie, Fred and neighbour Jennifer Smith over drawing, Monopoly and bedtime, where Julian tucks in Andrew, who idolises him.","old":false,"lead":"","who":["Julian","Joanie","Fred","Jennifer","Andrew"],"el":[["action","Establish the kids. A few beats:"],["action","Beat 1: Julian pencil sketches at the table and Andrew draws with crayons. There is a framed family portrait hanging. Julian’s drawing is quite sophisticated and Andrew looks at his drawing and then at his colored mess and looks sad. Julian takes his hand and helps him draw. Andrew looks up and smiles at his idol, his big brother: FREEZE FRAME"],["cue","JULIAN (V.O.)"],["dialogue","That’s my youngest sibling, Andrew. He was three and wanted to do everything I did. If I wanted to go out, there was always a chance I’d hear, “Take your brother with you.” At first I hated it. Then I realized Andrew got more attention from girls than I did. Better than a puppy. He was cute. Real cute.Most little brothers are a pain. Andrew was too, sometimes. But he was also pretty hard not to love."],["action","Beat 2: Julian with Andrew on his lap playing Monopoly against Fred and Joanie. Joanie lands on Go TO JAIL."],["cue","JOANIE"],["dialogue","That’s the second time! That’s not fair!"],["action","Joanie SCOWLS: FREEZE FRAME"],["cue","JULIAN (V.O.)"],["dialogue","That's Joanie. She was ten, sweet when she wanted something and sour as hell just about all of the other time. Joanie treated \"Mom said\" like a court order."],["action","Fred rolls the dice. He has multiple monopolies already and hands over cash to Julian to buy two houses and convert another with three houses to a hotel. Proudly he smiles"],["cue","FRED"],["dialogue","Third time in a row I’ve had a hotel on Boardwalk."],["action","Fred smiles proudly: FREEZE FRAME"],["cue","JULIAN (V.O.)"],["dialogue","Then there was Fred. He was seven He remembered everything and I mean everything!"],["action","Andrew rolls the dice and Julian helps him move his pieces. When they land on Free Parking and get the money in the middle Andrew celebrates."],["action","Beat 3: Andrew is in bed with a basketball. The room has New York Knicks decorations. Julian reads on a chair nearby. They turn and see Jennifer Smith in the doorway."],["cue","JENNIFER"],["dialogue","Okay, you two. Roo has homework and it’s past Andrew’s bedtime. I gotta go now so I’ll see you both tomorrow!"],["action","Jennifer blows a kiss to the boys."],["cue","JULIAN"],["dialogue","Okay, Jennifer."],["cue","ANDREW"],["dialogue","Goodnight Jenny!"],["action","Andrew blows multiple kisses back. Jennifer smith melts at the cuteness."],["action","FREEZE FRAME:"],["cue","JULIAN (V.O.)"],["dialogue","That’s Jennifer Smith. She lived a few houses over and was always around."],["dialogue","Helping my mother, looking after us kids, showing up when she was needed. Somewhere along the way she just became part of the family."],["action","Finishes, Kisses the forehead."],["cue","JULIAN"],["dialogue","Time for bed. Knicks won! Debusschere and Frazier led the Knicks in points."],["cue","ANDREW"],["dialogue","Yay!"],["action","Andrew smiles. Julian kisses the forehead and turns out the light."]]},{"id":"4","page":"4","pages":"4–5","slug":"INT. WESTBURY, LONG ISLAND FAMILY HOME - DAY","ie":"INT","loc":"WESTBURY, LONG ISLAND FAMILY HOME","time":"DAY","omitted":false,"summary":"Freeze frames introduce Barbara, cooking brisket, and Lenny, who makes knockoff designer shirts and is Julian's hero. Julian, 13, introduces himself; Fred and Joanie sort out chores.","old":false,"lead":"","who":["Barbara","Julian","Lenny","Fred"],"el":[["action","Kitchen - BARBARA, late 30s is seen taking a brisket out of the oven."],["cue","BARBARA"],["dialogue","Lenny! I need you to carve the brisket in five minutes! JOANIE!!!!"],["action","Freeze Frame:"],["cue","JULIAN (V.O.)"],["dialogue","That’s my mom, Barbara. A legal secretary, a wonderful mom, and a world-class worrier. But she loved her kids and she loved my dad"],["action","LENNY - 40's at his desk with work scattered everywhere packing his briefcase."],["cue","LENNY"],["dialogue","Gimme ten, Lo. If I don't finish these Ohrbach's cost sheets, we'll be eating paisley all next quarter."],["action","FREEZE FRAME"],["cue","JULIAN (V.O.)"],["dialogue","That's my dad, Lenny. He was in the garment business - made knockoffs of designer shirts. He could walk into a room and sell ice to winter. To me, he was a hero."],["cue","JULIAN (V.O.)"],["dialogue","Oh, and my name's Julian - I'm the oldest and being 13 was pretty cool. JOANIE Your turn to set the table, Fred."],["action","FRED, 7 builds a model airplane at the kitchen counter."],["cue","FRED"],["dialogue","It's Thursday. I clear, you set, Julian loads."],["action","Joanie rolls her eyes. Begins setting."],["trans","DISSOLVE TO:"]]},{"id":"5","page":"5","pages":"5–6","slug":"INT. WESTBURY, LONG ISLAND, NEW YORK FAMILY HOME - NIGHT","ie":"INT","loc":"WESTBURY, LONG ISLAND, NEW YORK FAMILY HOME","time":"NIGHT","omitted":false,"summary":"Over dinner Joanie mocks Julian's Pierre Cardin shirt, which Barbara will iron for tomorrow's school pictures. Lenny marvels at how lucky the family is.","old":false,"lead":"","who":["Julian","Barbara","Joanie","Lenny"],"el":[["action","Kitchen table - the family finishes dinner."],["cue","JULIAN"],["dialogue","Brisket was amazing, ma."],["cue","BARBARA"],["dialogue","Don't forget you have school pictures tomorrow."],["cue","JOANIE"],["dialogue","Are you going to wear this silly Pierre Cardin shirt?"],["action","Joanie points to a Paisley shirt hanging from a cabinet knob. (*note permission or product placement from other designer)"],["cue","BARBARA"],["dialogue","I'll iron it in the morning."],["cue","JULIAN"],["dialogue","Of course I am! Only kid in town with one."],["cue","JOANIE"],["dialogue","What a waste of money."],["cue","JULIAN"],["dialogue","When you make money shoveling snow, buy what you want."],["cue","LENNY"],["dialogue","Enough you two. Julian can wear whatever shirt he wants as long as he protects(MORE)(MORE) his little sister."],["dialogue","Are we lucky or what? A great house and a healthy family. What more could we want?"],["action","Barbara smiles warmly at Lenny, who winks at her. Julian notices, warmly smiling."],["cue","JULIAN (V.O.)"],["dialogue","We were lucky. We weren't rich, but we lived better than most and had love. As a kid, you think every family is like yours. I was wrong."]]},{"id":"A5","page":"6","pages":"6","slug":"INT. LENNY'S HOME OFFICE - NIGHT","ie":"INT","loc":"LENNY'S HOME OFFICE","time":"NIGHT","omitted":false,"summary":"Ironing his shirt for a big meeting, Lenny teaches Julian to \"sell to the masses\". He hopes Julian will take over the business, then unplugs the iron.","old":false,"lead":"","who":["Lenny","Julian"],"el":[["action","Julian in pajamas sits in his father's chair as Lenny irons his shirt on an ironing board."],["cue","LENNY"],["dialogue","Huge meeting tomorrow, Julian. A big deal...and you always look your best for a big meeting."],["action","Smash cuts of Lenny ironing as he takes the shirt off the board and snaps it hard before hanging it up and buttoning."],["cue","LENNY  (CONT’D)"],["dialogue","Remember - in fashion or any business ya buy what will sell. And what do you do? You sell to the masses -"],["cue","JULIAN"],["paren","(interrupting)"],["dialogue","And dine with the classes!"],["cue","LENNY"],["paren","(smiling)"],["dialogue","You've been paying attention! Maybe one day you'll take over the biz"],["action","Lenny unplugs the iron."],["cue","LENNY  (CONT’D)"],["dialogue","It's late. Time for bed."],["cue","JULIAN"],["dialogue","Okay pop."],["action","Julian gets up and gives his dad a hug."]]},{"id":"6","page":"7","pages":"7","slug":"EXT. WESTBURY, LONG ISLAND FAMILY HOME - NIGHT","ie":"EXT","loc":"WESTBURY, LONG ISLAND FAMILY HOME","time":"NIGHT","omitted":false,"summary":"The family home lies dark in the moonlight as the last bedroom light goes out.","old":false,"lead":"","who":[],"el":[["action","The moonlight casts down on the family home, dark except for one bedroom light which we see turn off. Good night."]]},{"id":"7","page":"7","pages":"7","slug":"INT. WESTBURY, LONG ISLAND, NEW YORK FAMILY HOME - NIGHT","ie":"INT","loc":"WESTBURY, LONG ISLAND, NEW YORK FAMILY HOME","time":"NIGHT","omitted":false,"summary":"Lenny wakes to smoke and fire and rouses Barbara. She burns her hand on Andrew's door; Lenny kicks it in to a blazing room with no floor: Andrew is gone.","old":false,"lead":"","who":["Lenny","Barbara"],"el":[["action","QUICK FADE IN FROM BLACK - sound first - crackle, whoosh and someone coughing. Master bedroom - ECU LENNY's eyes flutter open to discover thick grey smoke choking his room - the orange glow dancing outside his room. He coughs."],["cue","LENNY"],["dialogue","Barbara! Barbara! Wake up!"],["action","Quick Smash Cuts:"],["action","1- End table with family photo engulfed in flames;"],["action","2- Smoke pouring out from under a closed door"],["action","3- Hand enters frame and unlocks and opens window"],["action","4- POV of a smoke filled hallway and you can barely see the name ANDREW on the door down the hall."],["action","5 - Reverse Angle on Lenny and Barbara as they cough and cover their eyes as they navigate the smoke filled hallway."],["cue","BARBARA (O.S.)"],["dialogue","ANDREW!"],["cue","LENNY (O.S.)"],["dialogue","BARBARA, come on!"],["cue","BARBARA (O.S.)"],["dialogue","My baby's in there!"],["action","6- Barbara reaches for the doorknob and burns her hand."],["action","7- Lenny kicks in the door."],["action","8- POV of a bedroom in flames with no floor. It's gone."],["cue","LENNY (O.S.)"],["dialogue","He's gone, BARBARA! He's gone!!! BARBARA, he's gone."],["trans","SMASH CUT TO:"]]},{"id":"8","page":"8","pages":"8","slug":"EXT. WESTBURY, LONG ISLAND FAMILY HOME - DAWN","ie":"EXT","loc":"WESTBURY, LONG ISLAND FAMILY HOME","time":"DAWN","omitted":false,"summary":"At dawn, neighbours watch the charred wreckage as a paramedic bandages Barbara's hand. The fire marshal shows Lenny an iron with a melted label, and Lenny realises how the fire began.","old":false,"lead":"","who":["Julian"],"el":[["action","Three neighbors in their robes and pajamas look on at the charred wreckage.The sound of a dripping fire hose as a fireman rolls it up. Another fireman as a Chief makes notes as he looks over the damage. carries a ladder and an axe through frame. Firetrucks are seen in the b.g. and an ambulance is in the f.g. with Barbara sits on the gurney hyperventilating while a paramedic bandages her hand. Lenny has Julian, Joanie and Fred wrapped in a blanket next to her. The fire chief calls Lenny over and he slides Fred and Joanie to Julian’s care. (shoot the details of the fire marshal showing him the iron with the melted label on the iron face and the anguish on Lenny’s face as he grimaces and looks back at the surviving family realizing how the fire began wide and tight); Extension- period ambulance and firetrucks in b.g."],["cue","JULIAN (V.O.)"],["dialogue","You're thinking what everyone who was there that day was thinking..."],["paren","(beat)"],["dialogue","That poor family..."],["paren","(beat)"],["dialogue","And if you're wondering if everyone was okay...well, no..."],["paren","(beat)"],["dialogue","We weren't. And things would never be the same again, not ever."],["action","The horror transitions to a reverse negative image as we"],["trans","FADE OUT"]]},{"id":"9","page":"8","pages":"8–9","slug":"EXT. CEMETERY - DAY","ie":"EXT","loc":"CEMETERY","time":"DAY","omitted":false,"summary":"Dressed in black, the family drives away from the cemetery as Julian stares at Jennifer waving. In voice-over, he says they were running away from New York.","old":false,"lead":"","who":["Julian"],"el":[["action","SUPER: Fade in on the family in black approaching the station wagon. Mourners straggle by. The family gets into the car with Julian last. He hops into the rear facing seat. Lenny closes the back door and approaches the driver’s door, taking a look back before getting in and driving off."],["cue","JULIAN (V.O.)"],["dialogue","Turns out there isn't a handbook for losing a child. People had brought casseroles, clothes and flowers but nobody brought Andrew back. Eventually my parents decided what most people decide when they can't bear to look at something anymore. They left. My parents called it a fresh start. Looking back, I think it was something else. (MORE)(MORE)"],["dialogue","We weren't running toward California. We were running away from New York."],["action","Angle on Julian: CU TIGHT on his eyes. As they drive off, Julian stares at Jennifer waving against the cemetery."],["trans","FADE OUT"]]},{"id":"10","page":"9","pages":"9","slug":"EXT. CROSS COUNTRY IMAGES MONTAGE - DAY","ie":"EXT","loc":"CROSS COUNTRY IMAGES MONTAGE","time":"DAY","omitted":false,"summary":"Stock montage of the week-long drive to California, with Julian writing in a journal. In voice-over, he notes nobody mentions the house or Andrew.","old":false,"lead":"","who":["Julian"],"el":[["action","Stock montage of the cross country drive. WELCOME TO CALIFORNIA (also capture family members against green in car for compositing in post including Barbara looking at a polaroid of the family Andrew in her arms) Establish Julian writing in a journal."],["cue","JULIAN (V.O.)"],["dialogue","The trip took nearly a week. Three thousand miles. Twelve states. We watched America change through the rolled-down windows. Nobody talked about the house. Nobody said Andrew's name."]]},{"id":"11","page":"9","pages":"9","slug":"EXT. LOS ANGELES - DUSK","ie":"EXT","loc":"LOS ANGELES","time":"DUSK","omitted":false,"summary":"The family drives through Hollywood at dusk. Julian's voice-over covers a West LA motel, Lenny restarting his shirt business downtown, and the move to Encino.","old":false,"lead":"","who":["Julian"],"el":[["action","Pulling through Hollywood, past CBS TELEVISION CITY. Same family in a different world. Palm trees. Neon. California."],["cue","JULIAN (V.O.)"],["dialogue","We landed at a West LA Motel while my parents looked for a house. Nobody really talked about Andrew. Everybody had their own way of pretending they were okay. Dad found space downtown to restart his shirt business. Mom tried to hold us together. Eventually we landed in Encino."]]},{"id":"12","page":"9","pages":"9–10","slug":"EXT. ENCINO WEISS HOME - DAY","ie":"EXT","loc":"ENCINO WEISS HOME","time":"DAY","omitted":false,"summary":"The family arrives at their new Encino home, where Adam, the 12-year-old next door, waves to Julian. In voice-over, Julian says the memories came with them.","old":false,"lead":"","who":["Julian"],"el":[["action","The car pulls into the driveway of a typical valley home. The family gets out of the car, toting luggage. ADAM, a twelve year old holds a basketball and waves from across the driveway of the neighboring house. Julian waves back."],["cue","JULIAN (V.O.)"],["dialogue","I won't lie, the house was amazing. New furniture, a pool, and Mom took us to Loehmann's Plaza up the street—a sacred hunting ground for bargain shopping. We all tried to settle into our new home. The problem was, memories have a way of moving with you. Everywhere you go, there they are."]]},{"id":"13","page":"10","pages":"10","slug":"INT. ENCINO WEISS HOME - DAY","ie":"INT","loc":"ENCINO WEISS HOME","time":"DAY","omitted":false,"summary":"Aunt Rita's box of family photos, including Andrew on a pony, brings Barbara to tears. In a time jump, Julian, Joanie and Fred age to 20, 17 and 14.","old":false,"lead":"","who":["Barbara","Julian"],"el":[["action","Moved in and settled. Joanie reads a comic book while Fred reads, Julian watches TV and writes in his journal as Lenny reviews cost sheets. Barbara enters with a box"],["cue","BARBARA"],["dialogue","This just arrived. It's from Aunt Rita..."],["action","The kids look up but don't move. Lenny rises as Barbara opens the box. Inside are family photos. A sweet note from her sister and even a copy of an Andrew photo on a pony. Barbara gasps. Tears. Lenny has his arm around her. Joanie back to her comic book, Fred back to his novel. Julian lays down."],["cue","JULIAN (V.O.)"],["dialogue","People think grief is something everyone goes through together. It isn't. The years that followed would change all of us. Some changes happened slowly. Others happened all at once. My father buried himself in work. My mother buried herself in us. Joanie got angry. Fred got quiet."],["action","13 year old Julian, 10 Year old Joanie and 7 year old Fred transition into their 20, 17, & 14 year old versions."]]},{"id":"14","page":"10","pages":"10","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"15","page":"10","pages":"10–11","slug":"EXT. SOUTHERN CALIFORNIA - DAY","ie":"EXT","loc":"SOUTHERN CALIFORNIA","time":"DAY","omitted":false,"summary":"Julian, now about 20, drives his Alfa Romeo Spider from Malibu into Beverly Hills. In voice-over he recalls entering UCLA and how driving became his therapy.","old":false,"lead":"","who":["Julian"],"el":[["action","PCH in Malibu - a 1973 Alfa Romeo rips into frame driven by Julian, now about 20."],["cue","JULIAN (V.O.)"],["dialogue","As the years passed, my father rebuilt his business and it was growing. My mother rebuilt our family. And somehow, somewhere along the way...I grew up. I took all AP classes at Birmingham High School and entered UCLA as a sophomore. Dad had challenged me that if I could pull that off he'd split a ridiculous lease he found on a used Alfa Romeo Spider. I'd always worked — shoveling snow back in New York, delivering the Daily News on my bike in California, whatever I could do to have my own money. I'd also gotten a handsome reward from a stock pick I'd talked him into a couple years earlier. Turns out I had a pretty good head for numbers."],["action","Julian in the car along Mulholland, passing Casa de Cadillac, through the canyons, past UCLA on to Sunset Blvd before passing The Beverly Hills hotel and onto Canon Drive, the classic palm tree lined street in Beverly Hills."],["cue","JULIAN (V.O.)"],["dialogue","Driving was therapy before I knew what therapy was. Just me, the road and whatever song was playing on the radio. Somehow I discovered that motion was better than standing still. If I was moving and busy I forgot about whatever was bothering me. The road had a way of drowning it all out."],["action","Julian crosses Little Santa Monica into Beverly Hills."]]},{"id":"16","page":"11","pages":"11","slug":"EXT. GUCCI STORE - DAY","ie":"EXT","loc":"GUCCI STORE","time":"DAY","omitted":false,"summary":"Establishing shot of the Gucci store.","old":false,"lead":"","who":[],"el":[["action","Establishing shot."]]},{"id":"17","page":"11","pages":"11–12","slug":"INT. GUCCI STORE - DAY","ie":"INT","loc":"GUCCI STORE","time":"DAY","omitted":false,"summary":"In a slow-motion flash-forward, a man in a cowboy hat sprays champagne while Julian and models drink from boots. In voice-over, Julian says he's getting ahead of himself.","old":false,"lead":"","who":["Julian"],"el":[["action","Slo mo of a beat from The COWBOY SCENE..."],["cue","JULIAN (V.O.)"],["dialogue","Beverly Hills was like the wild West in 1975."],["action","A man in a cowboy hat sprays champagne all over."],["cue","JULIAN (V.O.)"],["dialogue","Sex, drugs, and rock 'n' roll may have been almost everywhere but Beverly Hills made it look classy."],["action","A bunch of models and Julian drink out of fancy boots."],["cue","JULIAN (V.O.)"],["dialogue","The fashion, the mayhem, the rush. Those were the moments I lived for. But, I'm getting ahead of myself now. I gotta slow down-let's rewind"],["action","Everyone in the slo mo colorful scene seems joyful."]]},{"id":"18","page":"12","pages":"12–13","slug":"EXT. GUCCI STORE - DAY","ie":"EXT","loc":"GUCCI STORE","time":"DAY","omitted":false,"summary":"Julian parks his Alfa outside Gucci and struts up. To camera, he explains why it must be Gucci, then peers in at Sophia dressing the window.","old":false,"lead":"","who":["Julian"],"el":[["action","Julian whips into the spot as if he owns it."],["cue","JULIAN (V.O.)"],["dialogue","When I whipped my Alfa directly in front of the large, polished brass double G's of Gucci, I knew in my gut that my life was never going to be the same."],["action","Julian uses the rearview mirror to work magic on his hair then struts confidently toward Gucci, taking in the view. Slo mo as Julian scans, noticing the luxury all around him."],["cue","JULIAN (TO CAM F. BUELLER STYLE)"],["dialogue","Why Gucci you wonder? Why not Tiffany or Hermes? Ya gotta understand that Aldo Gucci defined bold, flashy, sexy, Italian glamour. It was the brand of international rockstars, playboys, and Hollywood rebels. It had an intoxicating, dangerous energy that I wanted in on."],["action","Julian passes a beauty They give each other the once over."],["cue","JULIAN  (CONT’D)"],["dialogue","You have to understand that there was Gucci and then there was everyone else...and I didn't want to be \"everyone else\"."],["action","Julian peers inside. SOPHIA dresses a mannequin in the front window. Julian takes a deep breath, fixes his collar."],["cue","JULIAN (TO CAM)    (CONT’D)"],["dialogue","And so it began..."]]},{"id":"19","page":"13","pages":"13","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"20","page":"13","pages":"13–16","slug":"INT. GUCCI STORE - DAY","ie":"INT","loc":"GUCCI STORE","time":"DAY","omitted":false,"summary":"Manager Mauro Celoni eyes Julian up and hires him on the spot after Julian claims to be 25. He hasn't told his parents or girlfriend Candace.","old":false,"lead":"","who":["Julian","Mauro"],"el":[["cue","JULIAN (V.O.)"],["dialogue","Everything felt like slow motion..."],["action","Julian locks eyes and nods at SPOON, Black, late 20s, classy- looking who nods back. MAURO CELONI, emerges through the VIP Curtain thick Italian accent, Manager, and straight from Milan. Gucci is his life, and the mirror his best friend. Mauro checks his watch adjusting a display on the way."],["cue","JULIAN (V.O.)"],["dialogue","Holy shit was what came to mind. His dyed black hair was in direct contrast to his chalk-white skin. He looked like a vampire straight out of a Gucci ad campaign."],["action","Mauro points to VICTORIA to help a customer."],["cue","JULIAN (V.O.)"],["dialogue","Over-the-top, but impressive. It wasn't my style, but impressive nevertheless."],["action","Mauro puts out his hand motioning for Julian to take it."],["cue","MAURO"],["dialogue","I’m Mauro Celoni."],["cue","JULIAN"],["dialogue","Julian."],["cue","MAURO"],["dialogue","Nice to meet you Julian. And early! Even better than prompt. Had you been late, you wouldn't even have had a chance. Promptness is a must at Gucci."],["cue","JULIAN"],["dialogue","Yes, sir. Nice to meet you."],["action","Mauro sizes him up, like a piece of meat."],["cue","JULIAN (V.O.)"],["dialogue","For that moment in time, I finally understood how women felt being eyed up and down like dessert. I vowed then and there to always wear dark sunglasses when I do that to them."],["action","Before Julian could get in another word..."],["cue","MAURO"],["dialogue","You called the store every day for two weeks before I took your call?"],["action","Julian shrugs like “I guess?”"],["cue","MAURO  (CONT’D)"],["dialogue","I admire your persistence. I also found it incredibly annoying. You must really want to work here."],["cue","JULIAN"],["dialogue","Oh, I do. I know almost every item in the new line."],["cue","MAURO"],["dialogue","I see...Look, I only have a minute, Julian. The store closes in 5 for the afternoon break, and I have to get my nails done."],["cue","JULIAN"],["dialogue","Of course...no problem."],["cue","JULIAN (V.O.)"],["dialogue","Terrific. Thirty seconds in and I was already losing him."],["action","Two high shoppers fall out of the dressing room, knocking into a mannequin. Mauro motions for Spoon to clean up."],["cue","MAURO"],["dialogue","Looks like it was the good stuff. Is he hot or what?"],["action","Julian unsure of how to respond."],["cue","JULIAN"],["dialogue","Oh, yeah, for sure..."],["cue","JULIAN (V.O.)"],["dialogue","Definitely took a mental note of that."],["cue","MAURO"],["dialogue","I enjoyed our phone call, Julian. You do look simply fabulous! I think you'll fit in just perfectly. I just needed to be sure."],["action","Julian stands a little taller."],["cue","MAURO  (CONT’D)"],["dialogue","You are local, right?"],["action","Julian nods."],["cue","JULIAN"],["dialogue","Yeah, Westwood."],["cue","MAURO"],["dialogue","How old are you again?"],["cue","JULIAN"],["dialogue","Twenty-five."],["cue","MAURO"],["dialogue","Perfection! Can you start tomorrow?"],["action","Julian wasn't expecting that. Not so fast..."],["cue","JULIAN"],["dialogue","Um...yeah, sure. What time?"],["cue","MAURO"],["dialogue","Be here at ten. We'll start you behind the counter with scarves, wallets, and handbags so everyone can see you when they come in."],["action","Mauro winks, smiling and quite pleased with his decision."],["cue","MAURO  (CONT’D)"],["dialogue","You're just a little stud-muffin, aren't you?"],["cue","JULIAN"],["paren","(trying to sell it)"],["dialogue","So I've been told."],["cue","MAURO"],["dialogue","Okay, I have to run! See you tomorrow at 10!"],["action","Mauro walks off and Julian notices the Gucci Clock."],["cue","JULIAN (V.O.)"],["dialogue","Wow. At precisely 12:58 in the afternoon, I accepted a job at Gucci Beverly Hills! A move I hadn't discussed with my parents, my girlfriend Candace, or anyone else for that matter. At the time, it seemed like a perfectly reasonable part-time decision."]]},{"id":"21","page":"16","pages":"16–17","slug":"EXT. GUCCI STORE - CONTINUOUS","ie":"EXT","loc":"GUCCI STORE","time":"CONTINUOUS","omitted":false,"summary":"Outside, Julian celebrates with a fist pump and tells the camera he'll ride \"the Italian train\" as far as he can, then writes in his journal.","old":false,"lead":"","who":["Julian"],"el":[["action","Julian walks slowly, in awe. He can't believe it."],["cue","JULIAN (TO CAM)"],["dialogue","Did I just change the course of my entire life?"],["action","He walks a bit more and stops."],["cue","JULIAN (TO CAM)    (CONT’D)"],["dialogue","I just got hired at Gucci on the fucking spot."],["cue","JULIAN  (CONT’D)"],["paren","(Fist pump)"],["dialogue","Fuck yeah!"],["action","An older lady LAUGHS at his zest, and he's awakened from his stupor. He looks around again, spotting a row of stores."],["cue","JULIAN (TO CAM)    (CONT’D)"],["dialogue","Gucci was situated right smack in the middle of Rodeo Drive, sandwiched between Giorgio's and Yves Saint Laurent."],["action","Quick cuts smash together of 70's Fashion and Beverly Hills. A group of beautiful women pass as Julian talks to camera."],["cue","JULIAN (TO CAM)    (CONT’D)"],["dialogue","It only made sense that some liked the French and some the Americans, but dollar for dollar the world loved the Italians and so I decided I'd ride the Italian train as far as I could. I wasn't thinking much beyond that. When you’re that age, some people and places seem larger than life; (MORE)(MORE)"],["dialogue","it’s only when you mature and look back on those times that you realize how insignificant they are, but, fuck it, I’d still take young and naive over old and wise."],["action","Julian jumps into his car and makes a journal entry."]]},{"id":"22","page":"17","pages":"17","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"23","page":"17","pages":"17–18","slug":"INT. GUCCI STORE - DAY","ie":"INT","loc":"GUCCI STORE","time":"DAY","omitted":false,"summary":"Time jump, six months on: Julian and Spoon unpack shoes. Spoon, a struggling comic, has been picked to MC and gives Julian two tickets for Tuesday.","old":false,"lead":"","who":["Julian","Spoon"],"el":[["action","SUPER: \"6 MONTHS LATER\" Julian and Spoon, go through a new shipment of shoes."],["cue","JULIAN (V.O.)"],["dialogue","Six months in and Spoon and I had our rhythm."],["cue","SPOON"],["dialogue","Guess who Mitzi picked to MC next week?"],["cue","JULIAN"],["dialogue","What happened to Letterman?"],["cue","SPOON"],["dialogue","He's in New York taping $20,000 pyramid."],["action","Spoon adjusts his collar like a rooster strutting."],["cue","SPOON  (CONT’D)"],["dialogue","Ya know, sometimes hard work pays off, my brother."],["cue","JULIAN"],["dialogue","No shit? That's amazing!"],["action","Julian and Spoon slap five."],["cue","JULIAN (V.O.)"],["dialogue","Spoon liked to present himself as Detroit tough. Then he'd start talking comedy and forget he was supposed to be intimidating."],["action","The duo track a woman entering the shoe department like kittens tracking a laser pointer. Spoon hands Julian two tickets."],["cue","SPOON"],["dialogue","Next Tuesday night."],["cue","JULIAN (V.O.)"],["dialogue","Him being a struggling comic and me being his only captive listener did earn some pretty good perks though."],["action","Julian nods, and they both smile widely."]]},{"id":"24","page":"18","pages":"18–22","slug":"INT. GUCCI VIP AREA - DAY","ie":"INT","loc":"GUCCI VIP AREA","time":"DAY","omitted":false,"summary":"Cowboy's champagne-and-cocaine spree in the VIP area sets store records. Sophia, resenting Julian's sales, dances with Cowboy; Mauro praises Julian and suggests a drink, which Julian dodges.","old":false,"lead":"","who":["Cowboy","Julian","Victoria","Mauro","Sophia"],"el":[["action","Back to THE COWBOY SCENE. COWBOY, rich oil tycoon with two models draped on each shoulder, like chinchilla shawls. Bottles of Dom (or sponsored champagne) and champagne glasses in every hand."],["cue","COWBOY"],["dialogue","Where are them shit-kickers, Julian?!"],["cue","JULIAN"],["dialogue","I'm on it, Tex."],["paren","(yelling)"],["dialogue","Victoria!"],["action","VICTORIA, British, 30s, has dreams of becoming a supermodel, which you can tell by her walk. She's complex and secretive."],["cue","VICTORIA"],["dialogue","Coming, darling."],["action","Julian flashes her an unmistakably flirty smile. She pouts her lips and smirks as she holds 5 boxes while navigating the party. Cowboy pours dom into the mouths of his dates."],["cue","JULIAN (V.O.)"],["dialogue","God, Victoria was a specimen. She was also a bit of a mystery being a Brit and all...She had the legs and the brains...and I wasn't sure which was more dangerous. I could sense a lot was happening in her \"NON-GUCCI\" life, as we called it in the store...and it wore on her...but she wore it well, just like everything else."],["cue","VICTORIA"],["dialogue","Here are the last 5 pairs."],["action","Cowboy tips his hat."],["cue","JULIAN"],["dialogue","Thank you, love..."],["cue","COWBOY"],["dialogue","Wish you had more, but not a bad start. Heck, I'm just getting warmed up."],["action","INSERT- CU of price tag \"$500.00\" The bookends stumble around merch like they are buying groceries. SOPHIA, Spanish accent, late 30s, top salesperson at Gucci whispers to Mauro who reassures her and points his index finger summoning Julian."],["cue","MAURO"],["dialogue","Great call on the cowboy boots and ordering the Dom."],["cue","JULIAN"],["dialogue","He said they were thirsty and to surprise him - but don't worry he said to put it on his tab."],["cue","MAURO"],["dialogue","Too good! But slow down...finding that crocodile belt from the stockroom in 30 seconds? You're making the rest of us look bad!"],["action","Sophia sized up her rival as Julian blushes."],["cue","SOPHIA"],["dialogue","That's quite the party trick."],["cue","JULIAN"],["dialogue","Hey, everyone in life is shopping for something. Most people just don't know what it is yet."],["action","Sophia forces a pained smile."],["cue","SOPHIA"],["dialogue","Tell me. What am I shopping for?"],["cue","JULIAN"],["dialogue","I’d say . . . a fulfilling, tender relationship with a sensitive guy who understands your essence."],["cue","SOPHIA"],["dialogue","Wow, that’s good, kid. It’s completely wrong, but it’s good. You’re a natural salesman."],["cue","JULIAN"],["dialogue","Thanks."],["cue","SOPHIA"],["dialogue","Just remember, some of us actually need the commission."],["action","Julian clocks that as one of Tex’s calls for him."],["cue","JULIAN (V.O.)"],["dialogue","I was just doing what came naturally. I guess it really was a gift. And thinking about my dad, probably in my DNA."],["cue","MAURO"],["dialogue","That Julian is as smooth as the silk scarves he's been selling."],["cue","SOPHIA"],["paren","(seething)"],["dialogue","Smooth is one word for it."],["cue","JULIAN (TO CAM)"],["dialogue","Sophia was a badass woman, single mom raising a kid on Gucci commissions, and I respected the drive... because it rivaled mine. She didn't treat a sale like a game because for her it wasn't one. I know what you're thinking. No, I didn't sleep with Sophia. Thought about it...I remember thinking that it would have been a blast. And I didn't sleep with Victoria either. Turns out you can’t get laid by thinking about it."],["action","The bookends start to make out as Cowboy claps. One of the bookends spots a hat and runs to add it to the pile. Insert cash register ringing up price tags with a GRAND TOTAL OF $4,120.20. CONRAD appears with a bag of blow."],["cue","COWBOY"],["dialogue","Yeehaw! Now let’s really get this party going"],["cue","JULIAN (TO CAM)"],["dialogue","You can't make this shit up and if you did it wouldn't be believable."],["action","The bookends form a conga line as Cowboy pops another bottle."],["cue","COWBOY"],["dialogue","Come grab a toot girls."],["action","Cowboy gives a toot to each girl and pours champagne from the boot into their mouths one by one."],["cue","JULIAN (V.O.)"],["dialogue","He was like a Southern Santa, and instead of a Barbie or toy car...he was handing out Dom and coke."],["cue","COWBOY"],["dialogue","Julian, Spoon, take a seat. You know what to do, cowgirls. Ride em' like stags!"],["action","Victoria winces in the corner, Mauro is chugging from a bottle, as Sophia observes. Two of the girls straddle Julian and Spoon as the party cranks up."],["cue","JULIAN"],["dialogue","Christmas came early!"],["cue","COWBOY"],["dialogue","I like this fella."],["cue","JULIAN (V.O.)"],["dialogue","Throughout history, being rich could get you almost anything. But being rich in Beverly Hills in the 70s got you absolutley everything."],["cue","COWBOY"],["paren","(to Sophia)"],["dialogue","Hey curves!"],["action","Sophia immediately turns around."],["cue","COWBOY  (CONT’D)"],["dialogue","Where you from?"],["action","She bends down slowly to pick up a bottle and takes a swig. Victoria smokes a long cigarette and watches."],["cue","SOPHIA"],["dialogue","I’m from Argentina. Have you ever been there?"],["cue","COWBOY"],["dialogue","No, ma'am. But we should go - you could be my private tour guide."],["cue","SOPHIA"],["dialogue","I'd love to show you around."],["action","Both Victoria and his girlfriends are not too tickled by this exchange, but a beaming Sophia doesn't mind."],["cue","SOPHIA  (CONT’D)"],["dialogue","And what about a dance partner? Do you need one of those too?"],["cue","COWBOY"],["dialogue","Well, I been told I have two left feet my whole dang life so..."],["cue","SOPHIA"],["dialogue","That's okay. Let's do it, cowboy."],["action","Sophia extends her arm. Cowboy throws the bookends off of his lap and takes Sophia's hand. They dance all over the store. Julian grins at the lap dance a smiling Spoon is getting. Is this for real? Mauro smiles as his store is setting sales records. He motions for Julian to come over."],["cue","MAURO"],["dialogue","You are killing it, Julian."],["cue","JULIAN"],["dialogue","I told you I was good."],["cue","MAURO"],["dialogue","We should grab a drink sometime."],["cue","JULIAN"],["paren","(thinking fast)"],["dialogue","I don't know - I mean with us working together it could get complicated."],["cue","MAURO"],["dialogue","Well, sometimes complicated can be fun."],["trans","DISSOLVE TO:"]]},{"id":"25","page":"22","pages":"22–24","slug":"INT. GUCCI - HOURS LATER - SUNRISE","ie":"INT","loc":"GUCCI","time":"HOURS LATER - SUNRISE","omitted":false,"summary":"At sunrise Sophia and Victoria tidy the wrecked store as Mauro sleeps. Spoon finds his punchline, and Julian reminds him Cowboy got them on the Pips guest list.","old":false,"lead":"","who":["Sophia","Victoria","Spoon","Julian"],"el":[["action","The store is a disaster. Julian and Spoon. Mauro is asleep on the floor as Victoria and Sophia and others tidy."],["cue","SOPHIA"],["dialogue","So, this was a success, I suppose. At least for Julian and \"the dicks\"."],["action","Victoria can't help but LAUGH."],["cue","VICTORIA"],["dialogue","Is that what we call them? \"the dicks\" is it?"],["cue","SOPHIA"],["dialogue","Oh my god, yes! Look at them. Pito pequenos."],["cue","VICTORIA"],["dialogue","We'll still have to clean up this madhouse."],["action","ANGLE ON - Julian and Spoon sitting in the corner."],["cue","SPOON"],["dialogue","You know what I learned from selling shoes? It came to me last night."],["cue","JULIAN"],["dialogue","What's that, chief?"],["cue","SPOON"],["dialogue","It don't matter how much money you got - rich folks feet smell as bad as poor folks."],["cue","JULIAN"],["dialogue","That's true...what a night, huh? Don't forget - Cowboy got us on the guest list for Pips tomorrow night!"],["cue","SPOON"],["dialogue","I've been trying to get in there for a year now. Gonna be an event. Dress to impress, my man."],["action","Julian gives him a look like \"really?\""],["cue","SPOON  (CONT’D)"],["dialogue","Oh my bad - I forgot who I'm talking to."],["cue","JULIAN"],["dialogue","Man, I think I love her."],["cue","SPOON"],["dialogue","Which one?"],["cue","JULIAN"],["dialogue","The blonde."],["cue","SPOON"],["dialogue","Yeah, me too...but which one? There was three."],["action","They both LAUGH."],["cue","SPOON  (CONT’D)"],["paren","(having a realization)"],["dialogue","Wait. Damn it. There it is! I just came up with the fucking punchline I've been looking for all night. You coming Tuesday night still, right? You're not gonna bail on me for one of those blondes?"],["cue","JULIAN"],["dialogue","Come on! You gave me two tickets!"],["cue","SPOON"],["dialogue","That would be wrong if you brought my fantasy girl."],["cue","JULIAN"],["dialogue","Don't worry, I'll be there. This is huge for you, man..."]]},{"id":"26","page":"24","pages":"24–26","slug":"EXT. UCLA COURTYARD - DAY","ie":"EXT","loc":"UCLA COURTYARD","time":"DAY","omitted":false,"summary":"At UCLA, Julian tells girlfriend Candace he's late because Italian Cinema ran long. In voice-over he admits he's 20, has stopped classes and lives a double life.","old":false,"lead":"","who":["Julian","Candace"],"el":[["action","Julian hurries, a tad frazzled. He rounds the corner and locks eyes with a beautiful young brunette. CANDACE, 21, wholesome-looking in hippy clothes."],["cue","JULIAN (V.O.)"],["dialogue","Oh, and that Candace I mentioned? We were pretty serious. And I was actually twenty. The twenty-five I told Mauro was a little white lie to make sure I got hired. It worked"],["action","Julian and Candace hug and share a kiss."],["cue","JULIAN (V.O.)"],["paren","(rapid, anxious)"],["dialogue","I was living two separate lives. Nobody in my non-Gucci world knew I worked at Gucci or that I'd stopped taking classes, except Adam. And nobody at Gucci knew I was only twenty. Except Spoon."],["action","They find privacy and begin making out. It's hot and heavy, but with a hint of innocence. Candace pulls back and gets a good look at Julian. She touches his face."],["cue","CANDACE"],["dialogue","You’re late again! What happened to \"being on time is being late\"?"],["cue","JULIAN"],["dialogue","You're right, sorry baby. Italian Cinema ran long. Fellini has a way of doing that."],["cue","CANDACE"],["dialogue","That professor seems to be hooking you on Fellini."],["cue","JULIAN"],["paren","(looking away)"],["dialogue","Yeah."],["cue","CANDACE"],["dialogue","I get it. At the moment, I can't get enough of Van Gogh's brush strokes. Every time you think you understand the pattern it changes on you. Just mesmerizing."],["action","Julian gives a smile, but doesn't break her thought."],["cue","CANDACE  (CONT’D)"],["dialogue","It seems a bit cruel for someone so gifted to also be so pained, though the combo does make beautiful art."],["cue","JULIAN (V.O.)"],["dialogue","Candace's compassion for people and the world drew me in."],["action","Julian kisses her."],["cue","CANDACE"],["dialogue","Ohhh, what's this for?"],["cue","JULIAN"],["dialogue","Do I have to have a reason?"],["action","Candace - a look like maybe?"],["cue","JULIAN  (CONT’D)"],["dialogue","Okay, for the way you care so deeply about Van Gogh among other things."],["action","Julian moves in for another kiss."],["cue","CANDACE"],["paren","(taking Julian's hand)"],["dialogue","Yeah, yeah, yeah! I'm onto you Mr. tardy."],["cue","JULIAN"],["dialogue","Okay, art girl...I have an art question."],["cue","CANDACE"],["dialogue","Uh oh."],["cue","JULIAN"],["dialogue","I never understood the Mona Lisa's grin."],["cue","CANDACE"],["dialogue","That's because she's comfortable being uncomfortable...or she’s uncomfortable being comfortable. Great art is open to interpretation"],["paren","(beat)"],["dialogue","That...and you can't read her. How do you"],["action","We see Julian perplexed as he looks off into the distance."],["cue","JULIAN"],["dialogue","Yeah, I'll get through it. I have every year, so far."],["action","Candace studies him for a moment, then kisses him gently."]]},{"id":"27","page":"26","pages":"26","slug":"EXT. PIPS WEST HOLLYWOOD - NIGHT","ie":"EXT","loc":"PIPS WEST HOLLYWOOD","time":"NIGHT","omitted":false,"summary":"Establishing shot of the club's unmarked, members-only building, its valet line jammed with exotic cars.","old":false,"lead":"","who":[],"el":[["action","Establishing. Unassuming building Robertson Blvd. The valet line at the curb is jammed with high-end exotic cars of the era. No Logo or mention of PIPS but a sign that says “Members Only.”"]]},{"id":"28","page":"26","pages":"26–32","slug":"INT. PIPS WEST HOLLYWOOD - NIGHT","ie":"INT","loc":"PIPS WEST HOLLYWOOD","time":"NIGHT","omitted":false,"summary":"At Pips with Adam and Spoon, Julian sees Hefner arrive and worries Sophia resents him. Dawn, who recalls their prom night, dances with him and leads him off.","old":false,"lead":"","who":["Julian","Adam","Older Executive","Spoon","Group","Sophia","Dawn"],"el":[["action","Julian gives his name and is allowed to move down a corridor. Music and flashing lights are hears/seen. Sensory overload. Fashion on full display. Julian dons a 1- piece extra-thin white Lothar French-made cotton jumpsuit, from Theodore's. In slo mo he struts toward his Encino friend from high school, ADAM, 20. His looks right and left cut away to interesting Pips characters - some playing backgammon; Finally a young woman off to the side grabs his eye. DAWN, young and sultry, in a low-cut dress whispers \"HI\" as she puts the straw in her mouth Julian smiles back, smitten."],["cue","JULIAN (V.O.)"],["dialogue","I couldn't believe Cowboy got us in. Everyone at Gucci was beyond thrilled. Even got my partner in crime from high school, Adam on the list. Pips. I was in Hef's club! It was a windowless, velvet- and- chrome fortress where Hollywood's elite traded the paparazzi for backgammon tables. The only currency that mattered was status. Nobody knew I had none. My job was to make them believe I belonged."],["action","The clack of dice mixes with disco beats, fine steak, and the cigar smoke of rock stars and studio moguls. Adam looks at Julian's outfit shaking his head and pursing his lips."],["cue","ADAM"],["dialogue","You look like you're right out of GQ. This is unreal. How the hell did you get us in here?"],["cue","JULIAN"],["dialogue","Be cool. Don't blow our cover."],["action","An inebriated older exec with a supermodel pass the duo."],["cue","OLDER EXECUTIVE"],["dialogue","Hey man - good to see you again."],["cue","JULIAN"],["dialogue","You too."],["action","Julian nods and holds his head a little higher."],["cue","ADAM"],["dialogue","Who was that?"],["cue","JULIAN"],["dialogue","No idea. Must be the jumpsuit."],["cue","ADAM"],["dialogue","Seriously?"],["cue","JULIAN"],["dialogue","He thinks I'm somebody, who am I to correct him?"],["action","Julian sees Spoon across the backgammon tables waving him over to a 4-Top he's holding. Julian and Adam make their way past players, down a red carpet lit by disco lights. Bartenders refill empty glasses and light cigarettes. \"Full- service\" took on a whole new meaning."],["action","One sign points to RESTAURANT another to TOURNAMENT ROOM"],["cue","JULIAN (V.O.)"],["dialogue","Everywhere you looked there was somebody. Actors. Athletes. Rock stars. People I'd only seen on television. If you were anybody in Los Angeles, you eventually ended up at Pips."],["cue","ADAM"],["dialogue","Is that who I think it is?"],["cue","JULIAN"],["dialogue","Welcome to Pips."],["cue","ADAM"],["dialogue","This place is insane."],["action","They reach Spoon."],["cue","SPOON"],["dialogue","Damn, J - your Halloween costume is all set - you could go as a cult leader or a James Bond villain."],["action","Adam laughs."],["cue","SPOON  (CONT’D)"],["dialogue","What's up, Adam? Good to see you man."],["cue","ADAM"],["dialogue","You too, Spoon."],["cue","JULIAN"],["dialogue","Cowboy took good care of us."],["cue","SPOON"],["dialogue","That's called a fringe benefit. A perk."],["cue","GROUP"],["dialogue","HEF!"],["action","The whole room turns to greet the man."],["cue","JULIAN (V.O.)"],["dialogue","And there he was, the Midnight Messiah, Hugh Hefner with his entourage along with Tex and his bookends."],["action","Hef struts in like he owns the place, because he does."],["cue","SPOON"],["dialogue","Damn, I thought Tex was smooth, but he's got nothin on Hef."],["cue","JULIAN"],["dialogue","I don't know, Spoon. I don't see anyone drinking out of designer boots around here."],["action","They low-five."],["cue","SPOON"],["dialogue","I can dig it, Gucci Boy."],["action","Hef and his entourage are escorted to a reserved VIP area."],["cue","SPOON  (CONT’D)"],["dialogue","It's good to be the king."],["action","Julian is distracted. ANNA, a Texan 42 - Older. Intoxicating who passes and shares a flirtatious smile with Julian."],["cue","JULIAN"],["dialogue","What do you think she's drinking?"],["action","Julian stares as Sophia approaches with a tray of shots."],["cue","SOPHIA"],["dialogue","Shots?"],["cue","SPOON"],["dialogue","Has any guy ever turned down a shot from you?"],["cue","SOPHIA"],["dialogue","What do you think? But you guys can thank Tex - he's buying."],["action","Spoon takes one, Adam takes one and elbows Julian out of his trance who takes one. Quick cuts - disco, dancing, kissing, backgammon, margaritas delivered."],["cue","ADAM"],["dialogue","I heard our boy did well yesterday."],["cue","SPOON"],["dialogue","Gucci Boy was on his game!"],["cue","JULIAN"],["dialogue","Yesterday was amazing. I've been thinking ab(MORE)(MORE)out it all day."],["dialogue","I mean, knowing exactly what someone wants before they even do. There's nothing like it...It's almost spiritual."],["cue","SPOON"],["dialogue","Easy Gandhi."],["cue","JULIAN"],["dialogue","I'm serious, man. It was like magic, but I also kept thinking about Sophia."],["cue","SPOON"],["dialogue","Don't you have enough women on your mind, Warren Beatty?"],["cue","JULIAN"],["dialogue","Come on, man - didn't you notice something was off with her today?"],["cue","SPOON"],["dialogue","Well, she was the top dog before you set foot in the hallowed grounds of the \"Double G's\" pretending to be gay and shit."],["action","Julian ponders it..."],["cue","ADAM"],["dialogue","Wait, you pretended to be gay?"],["cue","JULIAN"],["dialogue","I didn't pretend anything, I just didn't say I wasn't. Big difference."],["cue","SPOON"],["dialogue","But is it? Really?"],["paren","(high-pitched)"],["dialogue","Oh yeah, for sure! That's what they tell me!"],["action","Adam laughs. Julian shakes his head."],["cue","JULIAN"],["dialogue","So you think Sophia is mad at me?"],["cue","SPOON"],["dialogue","I mean, she basically had to slow dance with Tex and let him lick her neck to sell a fraction of what you sold."],["cue","ADAM"],["paren","(jumping in for the jab)"],["dialogue","So did you have to blow old Tex's balls?"],["cue","JULIAN"],["paren","(defensive)"],["dialogue","You weren't even there...And no one blew anything."],["cue","SPOON"],["dialogue","Look, you're good. Nobody's arguing that. But most people spend years getting the kind of access to success you got in a few months."],["action","This sinks into Julian as three more margaritas arrive. Julian takes a big sip and the crowd gathers around a hot game as the pulsating rhythm cranks up the dance floor and Dawn reappears, swaying to the rhythm, her hips rocking side to side. Looking up, she catches Julian staring at her. She's on fire. He swallows at the mirage. Or is it? Dawn finishes her last sip and sets down the drink on a high top and gives him the look. Julian as if being commanded, rises."],["cue","JULIAN (V.O.)"],["dialogue","I wish I could say I wrestled with it."],["cue","SPOON"],["dialogue","Where are you going?"],["cue","JULIAN"],["dialogue","To see an old friend. I'll be right back..."],["action","Julian joins Dawn dancing. Flashing lights. Grooving. Spoon nods approvingly. Adam admires."],["cue","ADAM"],["paren","(to Spoon)"],["dialogue","Check out Jules!"],["cue","SPOON"],["dialogue","Go on, Gucci Boy...don't do anything I wouldn't do."],["action","Julian behind her with his arm around her waist, the two sway together as one."],["cue","DAWN"],["dialogue","Hey Jules - I haven't seen you since graduation. Where ya been?"],["cue","JULIAN"],["dialogue","I've been around."],["cue","DAWN"],["dialogue","Not around me. Ever think about our prom night?"],["cue","JULIAN"],["dialogue","Which part?"],["cue","DAWN"],["dialogue","The hotel part."],["cue","JULIAN"],["dialogue","Maybe?"],["cue","DAWN"],["dialogue","Liar..."],["action","Still dancing, feeling each other out in more ways than one."],["cue","DAWN  (CONT’D)"],["dialogue","So you're standing in a room with a bunch of guys trying really hard to be somebody. Please tell me you're not one of them."],["action","Julian looking around. Dawn smiles."],["cue","JULIAN"],["dialogue","I hope not."],["action","Julian twirls her around and looks her in the eyes. Dawn smiles and takes his hand, leading him off the dance floor."],["cue","DAWN"],["dialogue","Good. I missed you, Julian."]]},{"id":"29","page":"32","pages":"32","slug":"INT. WOMEN'S BATHROOM AT PIPS - CONTINUOUS","ie":"INT","loc":"WOMEN'S BATHROOM AT PIPS","time":"CONTINUOUS","omitted":false,"summary":"In quick flash cuts, Julian and Dawn hook up in a women's bathroom stall; a woman trying the door spots four legs and rolls her eyes.","old":false,"lead":"","who":["Dawn"],"el":[["action","A woman finishes applying lipstick when Dawn and Julian burst through the door laughing. The woman raises an eyebrow and huffs out. A series of flash cuts as music drives: A stall door swings open, they giggle/Kissing/A dress zipper goes down/A belt being loosened/A neck being kissed/Dawn smiling with pleasure. A hand tries to open the stall door."],["cue","DAWN"],["dialogue","Sorry, almost done..."],["action","Julian and Dawn freeze. The woman looks down and sees 4 legs in the stall and rolls her eyes. Dawn struggles not to laugh."]]},{"id":"30","page":"33","pages":"33","slug":"EXT. BATHROOM ENTRANCE PIPS - CONTINUOUS","ie":"EXT","loc":"BATHROOM ENTRANCE PIPS","time":"CONTINUOUS","omitted":false,"summary":"Coming out of the women's room, Julian and Dawn almost bump into Mauro, who chuckles and signals Julian to zip up. Dawn kisses his cheek and leaves.","old":false,"lead":"","who":["Dawn","Julian"],"el":[["action","Mauro rounds the corner and almost bumps into Dawn and Julian emerging from the women’s room. Julian blushes as Mauro chuckles and motions for Julian to zip it up."],["cue","DAWN"],["dialogue","Friend of yours?"],["cue","JULIAN"],["dialogue","Something like that."],["action","She kisses him on the cheek."],["cue","DAWN"],["dialogue","I have to go, handsome."]]},{"id":"31","page":"33","pages":"33–35","slug":"INT. PIPS CORRIDOR DINNER AREA - LATER","ie":"INT","loc":"PIPS CORRIDOR DINNER AREA","time":"LATER","omitted":false,"summary":"Julian collides with Anna, who keeps her name a secret. Back with Spoon and Adam, he admits he loves Candace but feels too young to get engaged.","old":false,"lead":"","who":["Julian","Anna","Adam","Spoon","Sophia"],"el":[["action","Julian walks back to the table and takes a shot from the waitress while a dance party engulfs the area. A random guy grabs Julian, twirls him, and then flies him across the dance floor where he spins into Anna who smiles, unhurt."],["cue","JULIAN"],["dialogue","Sorry."],["cue","ANNA"],["paren","(smiles)"],["dialogue","Honey, if that's the worst thing that happens to me tonight, I'm doing just fine."],["action","Anna winks before being dragged off by a line of dancers."],["cue","JULIAN"],["dialogue","Wait! What's your name?"],["cue","ANNA"],["dialogue","You'll have to bump into me again to find out, sugar!"],["action","Anna disappears as Julian finds his way back to his table."],["cue","ADAM"],["dialogue","What the hell happened?"],["cue","SPOON"],["dialogue","“They” had to go to the bathroom."],["action","Adam laughs. Julian puts his hands to his head in shame. The waitress lays down the check."],["cue","JULIAN"],["dialogue","Shit."],["cue","SPOON"],["dialogue","Looks like you stepped in it."],["cue","JULIAN"],["dialogue","I know, Spoon."],["cue","ADAM"],["dialogue","Hey, you're just sowing your wild oats. Cut yourself some slack."],["cue","JULIAN"],["dialogue","Candace would probably want to cut something else..."],["cue","SPOON"],["dialogue","Go easy man. If not now, when?"],["cue","JULIAN"],["dialogue","I agree in principle, but Candace is talking commitment. Engagement. Look at me."],["cue","SPOON"],["dialogue","Do you love her?"],["cue","JULIAN"],["dialogue","I do. But at the same time I feel like I'm only twenty. I don't know shit yet except what I pretend to. If I got engaged tomorrow, I'd spend the next ten years wondering what I missed."],["cue","ADAM"],["dialogue","You'd miss a lot. We’re too young."],["cue","SPOON"],["dialogue","I got your fix. You love designer clothes, right?"],["cue","JULIAN"],["dialogue","Yeah...of course."],["cue","SPOON"],["dialogue","Maybe you should think of creating your own line."],["action","Julian looks at him like: where are you going with this?"],["cue","SPOON  (CONT’D)"],["dialogue","You could start with some pants where the zipper locks!"],["cue","ADAM"],["dialogue","Brilliant! Like a modern designer chastity belt!"],["action","They are all LAUGHING now."],["cue","JULIAN"],["dialogue","That's not your worst idea for a joke, Spoon."],["action","Spoon considers the joke. Jots it down in his mini memo pad."],["cue","SPOON"],["dialogue","You're right...I can weave this into my material..."],["action","Julian looks at the check. Sophia grabs the check."],["cue","JULIAN"],["dialogue","Hey, what are you doing?"],["cue","SOPHIA"],["dialogue","It’s your lucky day, the damage is on Tex."],["cue","JULIAN"],["dialogue","Well here’s to Tex!"],["action","They clink glasses."]]},{"id":"32","page":"35","pages":"35","slug":"EXT./INT. WESTBURY, LONG ISLAND - NIGHT","ie":"EXT/INT","loc":"WESTBURY, LONG ISLAND","time":"NIGHT","omitted":false,"summary":"Montage of nightmare flashback images of the Westbury fire: flames, sirens, voices.","old":false,"lead":"","who":[],"el":[["action","Montage nightmare flashback images: Fire/Sirens/Voices etc."]]},{"id":"33","page":"35","pages":"35","slug":"INT. JULIAN'S APARTMENT - DAY","ie":"INT","loc":"JULIAN'S APARTMENT","time":"DAY","omitted":false,"summary":"The alarm blares and Julian sits up in bed, panicked.","old":false,"lead":"","who":[],"el":[["action","The alarm blares as Julian sits up in bed panicked. (get a quick shot of Julian writing in his journal to be used anywhere)"]]},{"id":"34","page":"35","pages":"35","slug":"EXT. JULIAN IN HIS CAR 101 FWY - NEXT MORNING","ie":"EXT","loc":"JULIAN IN HIS CAR 101 FWY","time":"NEXT MORNING","omitted":false,"summary":"Julian drives his Alfa along the freeway past the Capitol Records Building.","old":false,"lead":"","who":[],"el":[["action","Julian drives his Alfa past the Capitol Records Building."]]},{"id":"35","page":"36","pages":"36","slug":"EXT. SHIRT WAREHOUSE - DAY","ie":"EXT","loc":"SHIRT WAREHOUSE","time":"DAY","omitted":false,"summary":"Julian pulls in and parks by the loading dock of a shirt warehouse.","old":false,"lead":"","who":[],"el":[["action","Julian pulls in and parks by a warehouse loading dock."]]},{"id":"36","page":"36","pages":"36","slug":"INT. WAREHOUSE ENTRANCE/HALLWAY - CONTINUOUS","ie":"INT","loc":"WAREHOUSE ENTRANCE/HALLWAY","time":"CONTINUOUS","omitted":false,"summary":"Inside, Lenny checks shirts on a rolling rack with his workers and warmly waves Julian in.","old":false,"lead":"","who":["Lenny","Julian"],"el":[["action","Workers showing Lenny shirts hanging on a rolling wardrobe cart."],["cue","LENNY"],["dialogue","There he is!"],["cue","JULIAN"],["dialogue","Hey pop."],["cue","LENNY"],["dialogue","Looks good, Nate! Julian come on!"]]},{"id":"37","page":"36","pages":"36–39","slug":"INT. SHIRT WAREHOUSE OFFICE - CONTINUOUS","ie":"INT","loc":"SHIRT WAREHOUSE OFFICE","time":"CONTINUOUS","omitted":false,"summary":"Lenny, proud of Julian's supposed summer classes, likes his advice on jackets and asks him to take over the day-to-day after graduation. Julian feels guilty.","old":false,"lead":"","who":["Lenny","Julian"],"el":[["action","A (create our own) map of the U.S. is pinned on the wall. Samples of shirts and fabrics are strewn everywhere."],["cue","LENNY"],["dialogue","Come on in, sonny-boy."],["action","Lenny in his element. The LA business rebuilt."],["cue","JULIAN"],["dialogue","Sorry, I got caught up studying and then hit LA traffic on the way in."],["action","Lenny gives his son a big hug, his usual kiss on the cheek and a pat on the back. The love is palpable."],["cue","LENNY"],["dialogue","Cut the shit, Julian. I wasn't born yesterday. I've been sizing people up longer than you've been alive."],["action","Lenny playfully right hooks Julian's tense shoulder and laughs"],["cue","JULIAN (V.O.)"],["dialogue","I was never so happy to get punched"],["cue","LENNY"],["dialogue","Come on, don't sweat it. Proud you're taking summer classes to graduate early. Could really use you full-time here!"],["cue","JULIAN"],["dialogue","Oh, really?"],["cue","LENNY"],["dialogue","Glad to see you've got my work ethic...your style sense could use some work though."],["cue","JULIAN"],["dialogue","Are you kidding me? Come on, pop - look at me. Mom really let's you leave the house looking like that?"],["action","Lenny is tickled by the messing around and approaches his desk, motioning for Julian to take a seat in front of it."],["cue","JULIAN (V.O.)"],["dialogue","I thought he knew for a minute. I thought the jig was up, but really, he was just being a supportive father...That was the first time I I really felt guilty. Dads have a way of doing that to you..."],["action","Lenny shows Julian his spreadsheet."],["cue","LENNY"],["dialogue","I just bought enough fabric for five hundred sweaters."],["cue","JULIAN"],["dialogue","How many jackets?"],["cue","LENNY"],["dialogue","About two hundred."],["cue","JULIAN"],["dialogue","Why?"],["cue","LENNY"],["dialogue","Sweaters are cheaper to make."],["cue","JULIAN"],["dialogue","Yeah...but every time I come by here you're sold out of jackets."],["action","Lenny shrugs."],["cue","LENNY"],["dialogue","That's true."],["cue","JULIAN"],["dialogue","Wouldn't you make more making another three hundred jackets instead?"],["cue","LENNY"],["dialogue","How do you figure?"],["cue","JULIAN"],["dialogue","Same money. Better return."],["action","Lenny studies him for a beat."],["cue","LENNY"],["paren","(smiles)"],["dialogue","You know...that's not a bad way to look at it."],["cue","JULIAN"],["dialogue","That's only half the equation, Pop."],["cue","LENNY"],["dialogue","What's the other half?"],["cue","JULIAN"],["dialogue","Buy more of what sells best."],["action","Lenny smiles proudly."],["cue","LENNY"],["dialogue","I like that...Matter of fact, that brings me to something I wanted to talk to you about. I've been doing a lot of thinking about life and the family and what not."],["cue","JULIAN"],["dialogue","Thinking a lot? That can't be good!"],["action","Lenny gives a boldsmile reminiscent of Julian's."],["cue","LENNY"],["dialogue","Look at you, son. You're the real deal. With your summer classes you'll graduate winter quarter."],["action","Julian looks around, eyes wide."],["cue","LENNY  (CONT’D)"],["dialogue","The business is getting bigger. I can't do it all myself anymore."],["action","Julian concerned."],["cue","LENNY  (CONT’D)"],["dialogue","I don't want to hire another exec when I can teach my son the business. Seems like an easy choice to me. After graduation I’d like you to start taking on the day-to- day. I think you're ready, kid."],["cue","JULIAN"],["dialogue","Ya mean like next April?"],["cue","LENNY"],["dialogue","It's YOUR America, Julian. Keep the lights on, keep selling shirts, then put your own stamp on it."],["action","Lenny takes a long pause as Julian comes to a halt."],["cue","LENNY  (CONT’D)"],["dialogue","Remember, you buy what will sell."]]},{"id":"A37","page":"39","pages":"39","slug":"INT. WESTBURY, LONG ISLAND - NIGHT","ie":"INT","loc":"WESTBURY, LONG ISLAND","time":"NIGHT","omitted":false,"summary":"Flashback to Westbury: Lenny and Julian repeat the family motto together, and Lenny explains that's why they make knockoffs.","old":false,"lead":"","who":["Lenny","Julian"],"el":[["action","FLASHBACK: Westbury scene of same bit then back for repeat."],["cue","LENNY & JULIAN"],["dialogue","Buy for the masses and eat with the classes."],["cue","LENNY"],["dialogue","That's why we knock 'em off."]]},{"id":"B37","page":"39","pages":"39–41","slug":"INT. LENNY'S OFFICE - DAY","ie":"INT","loc":"LENNY'S OFFICE","time":"DAY","omitted":false,"summary":"Lenny wants to announce the plan to the family tonight, but Julian talks him out of it. When Julian asks what happened to Andrew, a flustered Lenny deflects.","old":false,"lead":"","who":["Julian","Lenny"],"el":[["action","Julian searches for words."],["cue","JULIAN"],["dialogue","What did mom say about this grand scheme of yours?"],["cue","LENNY"],["dialogue","Oh, she knew this would happen one day. I think she'll be thrilled. I was thinking we announce it to the family tonight."],["action","The phone RINGS loudly. Julian JUMPS. Lenny picks it up."],["cue","LENNY  (CONT’D)"],["dialogue","I'll call them back. Tell him I'm with my son right now."],["action","He hangs up."],["cue","JULIAN"],["dialogue","Tonight?"],["cue","LENNY"],["dialogue","No?"],["cue","JULIAN"],["dialogue","I don't think so, pop...it's a big night. I don't want to confuse why we're all, ya know, together."],["action","Lenny contemplates."],["cue","LENNY"],["dialogue","Hmmm...I see what you mean..."],["action","Lenny gets up and rounds the desk in front of Julian"],["cue","LENNY  (CONT’D)"],["dialogue","Come here..."],["action","Huge fatherly hug."],["cue","JULIAN (V.O.)"],["dialogue","Those hugs would get me every time. Suddenly, I was seven again."],["cue","LENNY"],["dialogue","You're going to be 21 soon, Julian. I think this is the right move at the right time. The world is yours."],["action","Julian forces another half-smile, nodding and walks backward."],["cue","LENNY  (CONT’D)"],["dialogue","See you at the house."],["cue","JULIAN (V.O.)"],["dialogue","Not sure why in that moment I asked, but something was gnawing at my insides."],["action","Julian turns back around."],["cue","JULIAN"],["dialogue","I actually wanted to talk to you about Andrew and the whole thing. Like what happened."],["action","Flash of Westbury home on fire, Julian's hazy memory."],["cue","LENNY"],["paren","(a bit flustered)"],["dialogue","What's there to talk about? You know what happened. Tragedy happens sometimes. You pick yourself up and you move on."],["action","Lenny notices Julian's pain."],["cue","LENNY  (CONT’D)"],["dialogue","Jules, we all miss him. We all do. But we're still here. We're still alive. We have to keep moving forward."],["cue","JULIAN (V.O.)"],["dialogue","My dad never beat around the bush so when he did, I noticed."]]},{"id":"37A","page":"41","pages":"41","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"38","page":"41","pages":"41–43","slug":"INT. GUCCI STORE - AFTERNOON","ie":"INT","loc":"GUCCI STORE","time":"AFTERNOON","omitted":false,"summary":"Fitting shoes for Elin, a Playmate of the Year, Julian invites her to Pips; she declines because he's a stranger. Afterwards he finds the bracelet she dropped.","old":false,"lead":"","who":["Julian","Elin"],"el":[["action","The store is busy. Julian carries a box of shoes toward a gorgeous woman he is enamored with."],["cue","JULIAN (V.O.)"],["dialogue","I could do the once-over in a millisecond from top to bottom. Kind of like what Mauro did to me when we first met."],["action","Julian kneels and the bare foot of a gorgeous woman in his hand, as if he's the Prince fitting Cinderella."],["cue","JULIAN (V.O.)"],["dialogue","I always started with the shoes...I went bottom to top. That told me everything I needed to know."],["action","ELIN, Norwegian, 20s, heavy accent, poor English, in a barely- there skirt, looking like she's on the cover of Playboy."],["cue","JULIAN"],["paren","(caressing the shoe)"],["dialogue","Nice. These will make your legs look out of sight. Not that they need help."],["action","Elin gets up and struts towards the mirror all but flashing Julian the goods."],["action","As she turns to look over her shoulder at the back of her legs she holds onto a nearby display for balance and the clasp of her bracelet opens and the bracelet falls onto the floor, unnoticed by Elin or Julian."],["cue","ELIN"],["paren","(to the shoes)"],["dialogue","Yes! I think you are the right one."],["cue","JULIAN"],["dialogue","Absolutely."],["cue","ELIN"],["dialogue","Where does I go at night to wear them?"],["cue","JULIAN"],["dialogue","You could wear these anywhere..."],["action","Elin looks for an actual recommendation."],["cue","JULIAN  (CONT’D)"],["dialogue","I mean you've got The Whiskey, The Roxy or The Odyssey for Disco or The Comedy Store if you want a laugh - but - if you want something really fun there is PIPS."],["cue","ELIN"],["dialogue","Ah yes. Pips...Hef's place. He told me about this... food, games, and disco!"],["cue","JULIAN"],["dialogue","Wait - Hef told you about it?"],["cue","ELIN"],["dialogue","Yes. I was just in the book."],["cue","JULIAN"],["dialogue","The book? Like Playboy?"],["cue","ELIN"],["dialogue","Yes, that's it. I mean on it. The front."],["cue","JULIAN"],["dialogue","You mean the cover?"],["cue","ELIN"],["dialogue","Yes. That's how you say. Cover!"],["action","Julian's eyes widen, which delights Elin."],["cue","JULIAN (V.O.)"],["dialogue","It turns out that Elin was a Playmate of the Year and one of the first Playmates to show pubic hair in the history of the magazine. Social progress was happening at a dizzying pace."],["action","He watches Elin fix her hair and lipstick in the mirror."],["cue","JULIAN (V.O.)"],["dialogue","There was no other description for her other than unreal...and in more ways than the obvious one."],["cue","JULIAN"],["dialogue","I'm hitting Pip's this Thursday night...I'll buy you a \"Long Island\", if you're free?"],["action","Victoria is folding scarves and eavesdropping. Julian catches her eyes and looks away a little shameful."],["cue","ELIN"],["dialogue","Well, I like to go but we just meet. I mean you are a stranger!"],["action","She takes the box from Julian."],["cue","JULIAN"],["dialogue","I've been told I was strange before but never a stranger. What is your name? I'm Julian."],["cue","ELIN"],["dialogue","Well, maybe next time Julian. I am Elin and Elin's mother taught her to never talk to strangers."],["action","Elin walks to the front of the store. Julian sighs as she pays and leaves. Julian puts some stock back then notices the bracelet."]]},{"id":"39","page":"43","pages":"43–45","slug":"EXT. GUCCI STOCK ROOM - DAY","ie":"EXT","loc":"GUCCI STOCK ROOM","time":"DAY","omitted":false,"summary":"Julian brings Victoria tea in the stockroom. She confesses to being three people and asks how many he is, then invites him and Spoon to her dinner party.","old":false,"lead":"","who":["Julian","Victoria"],"el":[["action","Julian enters with two to go drinks. Victoria is counting handbags."],["cue","JULIAN"],["dialogue","Hot tea with lemon and cream?"],["cue","VICTORIA"],["dialogue","Well that was sweet, what do you want?"],["cue","JULIAN"],["dialogue","Nothing. Just being nice."],["cue","VICTORIA"],["dialogue","Did they make you wait in line?"],["cue","JULIAN"],["dialogue","Uh, yeah."],["cue","VICTORIA"],["dialogue","Shame. I was beginning to think the rules didn't apply to you anymore. I’m sorry for being cheeky. Thank you for the tea. I’m tired. Being so many people is bloody exhausting."],["action","Julian stares at Victoria. It's a moment."],["cue","JULIAN (V.O.)"],["dialogue","I wasn't expecting honesty. Especially from someone who worked at Gucci. For a sec, neither one of us was pretending. That was rare."],["cue","VICTORIA"],["paren","(venting)"],["dialogue","I feel like I have to be three people. Gucci Victoria. Victoria at home with my mum and grand-mum. And then the real one somewhere in the middle...How many people are you?"],["action","They lock eyes again."],["cue","JULIAN (V.O.)"],["dialogue","Victoria was sharp. She was one of the few who could make me itchy inside. Usually that meant they \"got\" me."],["action","Julian now locks his arm with hers in a nonsexual and loving way. Victoria is grateful."],["cue","JULIAN"],["dialogue","I didn't know you lived with your mom and grandma. That must not be easy."],["cue","VICTORIA"],["dialogue","It could be worse."],["cue","JULIAN"],["dialogue","Yeah?"],["cue","VICTORIA"],["dialogue","You didn't answer...How many people are you?"],["cue","JULIAN"],["dialogue","Oh...man...I think just the two. Gucci and non Gucci."],["cue","VICTORIA"],["dialogue","Ahh. That seems manageable enough."],["cue","JULIAN"],["dialogue","Depends on the day."],["cue","VICTORIA"],["dialogue","I have to go relieve Sophia up front, but I'm throwing a big dinner party in the hills with Farrah Fawcett's cousin next week."],["action","Julian's eyes get a tiny spark."],["cue","VICTORIA   (CONT’D)
