"],["dialogue","I'll get you the details...and bring Spoon with you, he's funny. And thanks for the tea, Jules..."],["action","Julian follows Victoria out of the stockroom."]]},{"id":"40","page":"45","pages":"45–47","slug":"INT. GUCCI STORE - CONTINUOUS","ie":"INT","loc":"GUCCI STORE","time":"CONTINUOUS","omitted":false,"summary":"Elin returns for her bracelet. Julian hands it over and she agrees to meet him at the store Thursday at ten, keeping her address to herself.","old":false,"lead":"","who":["Julian","Elin"],"el":[["action","Julian notices Elin entering the store and moving to the back and looking for her bracelet on the floor. The reflection of her body in the mirror is difficult for Julian to handle."],["cue","JULIAN"],["dialogue","Looking for this?"],["action","Elin on all fours bends over and looks up at Julian holding her bracelet. Julian extends his hand and helps Elin up."],["cue","ELIN"],["dialogue","My bracelet!"],["cue","JULIAN"],["dialogue","Yeah I found it but you were already long gone."],["cue","ELIN"],["dialogue","Oh my God! Thank you! This was gift from my sister."],["cue","JULIAN"],["dialogue","No problem and hey - I'm not really a stranger anymore so what do you think about Pips?"],["action","Elin smiles. He is persistent. And cute."],["cue","ELIN"],["dialogue","Well, technically I guess we are strangers no longer, so..."],["cue","JULIAN"],["dialogue","I mean I don't want you to break your mom's rules..."],["cue","ELIN"],["dialogue","Okay I meet you this Thursday but don't know where Pips is."],["cue","JULIAN"],["dialogue","I can pick you up?"],["cue","ELIN"],["dialogue","No. I meet you here."],["cue","JULIAN"],["dialogue","I can pick you up at your place if it's easier."],["cue","ELIN"],["dialogue","No thank you. First date I hide where I live. I wait to see if I like you. You're fast talker, but sweet."],["action","Julian can't find fault in her logic."],["cue","JULIAN"],["dialogue","What time do you want to meet here?"],["cue","ELIN"],["dialogue","Ten. I believe in opening doors and being on time."],["cue","JULIAN"],["dialogue","Me too."],["cue","ELIN"],["dialogue","I see you later then..."],["action","He walks with her to the door and is about to open it for her when she races to get to it first to open it."],["cue","ELIN  (CONT’D)"],["dialogue","I like do some things for myself... But still like when man tries."],["action","She smiles and vanishes leaving Julian excited and amazed."]]},{"id":"41","page":"47","pages":"47","slug":"EXT. ENCINO WEISS HOME - NIGHT","ie":"EXT","loc":"ENCINO WEISS HOME","time":"NIGHT","omitted":false,"summary":"Establishing shot of the Weiss home in Encino, Julian's Alfa and other cars in the driveway.","old":false,"lead":"","who":[],"el":[["action","Establishing. Julian's Alfa and others are in the driveway."]]},{"id":"42","page":"47","pages":"47–50","slug":"INT. ENCINO WEISS HOME - NIGHT","ie":"INT","loc":"ENCINO WEISS HOME","time":"NIGHT","omitted":false,"summary":"Julian's call to a Jennifer Smith fails. At Andrew's 10th birthday dinner he asks why they never light candles; Lenny's reply about the fire leaves Barbara in tears.","old":false,"lead":"","who":["Julian","Barbara","Adam","Lenny","Joanie","Fred","The Group"],"el":[["action","Julian gets a soda from the fridge and sees the phone book on the counter and looks up Jennifer Smith and impulsively dials 516 555-0118 the number but gets a disconnected notice. He walks back to the dining room as the family finishes up dinner. There's a banner that says, \"Happy Birthday, Andrew\"."],["cue","JULIAN (V.O.)"],["dialogue","We did this every year. A birthday party for my brother, who never made it to four. Dinner. Cake. We told ourselves it was for him. The only problem was he'd been dead for seven years. I think my parents needed it. Maybe they were afraid that if they stopped, Andrew would disappear for good. For me, it always felt a little strange."],["action","Julian sits next to Adam. Lenny is at the head of the table, while Barbara sits at the other. Fred and Joanie sit opposite Julian and Adam. Unusually quiet as the family finishes up dinner."],["cue","JULIAN"],["dialogue","That was delicious, Mom."],["cue","BARBARA"],["dialogue","The brisket wasn't too dried out, was it?"],["cue","ADAM"],["dialogue","Best I've ever had."],["cue","LENNY"],["dialogue","It was perfect, sweetie."],["action","Lenny stands with his Rusty Nail. He DINGS the glass with a knife. Julian's eyes widen."],["cue","LENNY  (CONT’D)"],["dialogue","Can I have everybody's attention?"],["cue","JULIAN (V.O.)"],["dialogue","I know we'd just talked about not making the announcement about me and the family business tonight. But after Rusty Nail number two, I panicked. For some reason I was convinced he'd forgotten."],["action","Julian stands before Lenny can continue."],["cue","JULIAN"],["dialogue","You know what, dad, I think I should do it this year..."],["action","Julian smiles awkwardly to a bunch of bewildered looks."],["cue","JOANIE"],["paren","(flippant)"],["dialogue","Here we go..."],["action","A touched Barbara looks to Joanie with daggers in her eyes."],["cue","BARBARA"],["dialogue","Joanie!"],["cue","JOANIE"],["dialogue","The golden boy. I forgot."],["action","This time Barbara's stare shuts Joanie up, and she looks down. Julian looks at Adam who gives him a nod."],["cue","JULIAN"],["dialogue","On this special day, we all come together to remember Andrew. A son, a brother. Today he would have been"],["cue","FRED"],["cue","JULIAN"],["paren","(annoyed)"],["dialogue","Thanks, Fred."],["cue","FRED"],["dialogue","He was born in 1965 and it's 1975, so that would make him 10."],["cue","JULIAN"],["dialogue","Correct. Thank you Fred. Andrew we all miss you dearly! I wonder all the time what you'd be like. You'd probably be a basketball prodigy. I know you loved The Knicks. They won the championship in 70 and 73. Wish you coulda seen it. They did pretty bad this last season. Who knows when they'll win another. Anyway, I wish we'd gotten more time with you. We all miss you That's really all I wanted to say...Happy Birthday, little brother. TO ANDREW"],["action","Everyone raises their glass. Barbara rises, teary."],["cue","BARBARA"],["dialogue","I'll go get the cake."],["cue","JOANIE"],["dialogue","I'll help, mom."],["cue","ADAM"],["dialogue","Nice job, Jules."],["cue","LENNY"],["dialogue","So Adam - how’s your folks?"],["cue","ADAM"],["dialogue","They’re good, Mr. B - they’re in Hawaii for their anniversary!"],["action","Barbara and Joanie come back into the dining room with a cake that says \"Happy 10th Birthday Andrew\""],["cue","BARBARA & JOANIE"],["paren","(SINGING Happy Birthday)"],["dialogue","Happy birthday to you..."],["action","The group joins in as Barbara places the cake on the table."],["cue","THE GROUP"],["dialogue","Happy birthday to you, happy birthday dear Andrew, happy birthday to you."],["action","Barbara is sobbing. The group is frozen. Nobody moves. Adam looks around. Julian stares at the cake. Lenny looks away. Fred looks at Barbara. Joanie sighs."],["cue","JULIAN"],["dialogue","Dad...how come we never light candles for Andrew?"],["action","You can hear a pin drop. It's finally being talked about. Lenny looks at Julian then at Barbara who is trying to cope."],["cue","LENNY"],["dialogue","Do you have to ask?"],["cue","JULIAN"],["dialogue","I'm sorry. It's just that this whole thing is weird."],["action","Lenny grimaces at Julian without blinking for a painful few seconds, then takes a sip of his drink before speaking."],["cue","LENNY"],["dialogue","If you have a child who dies in a fire, which I pray you never do, you let me know if you'd want a flame on their birthday cake."],["action","Barbara breaks into tears and leaves the table for the kitchen. Julian instantly regrets asking the question. The air is sucked out of the room. Julian follows Barbara, putting his arm around her."],["cue","JULIAN"],["dialogue","Mom, I'm sorry."],["cue","BARBARA"],["dialogue","You don’t think I wonder what Andrew would be like every day?"],["cue","JULIAN"],["dialogue","I know...I'm sorry."],["action","Barbara collapses into his arms. Lenny looks on in pain."],["cue","JULIAN  (CONT’D)"],["dialogue","Dad...I'm sorry."],["action","Lenny doesn't say anything and nods."],["cue","LENNY"],["dialogue","Well, eat up everyone..."],["cue","JULIAN (V.O.)"],["dialogue","I also never forgot that look and that aching feeling that something was off."]]},{"id":"43","page":"50","pages":"50","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"44","page":"50","pages":"50","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"45","page":"51","pages":"51","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"46","page":"51","pages":"51","slug":"INT. JULIAN'S APARTMENT - NIGHT","ie":"INT","loc":"JULIAN'S APARTMENT","time":"NIGHT","omitted":false,"summary":"With his parents silent, Julian phones Jennifer Smiths from a list, crossing each one out, and goes to bed disappointed.","old":false,"lead":"","who":["Julian"],"el":[["action","We see a tidy apartment. The closet is flawlessly organized by color of shirts, pants, suits, and sport coats. In the living room there are a couple of signed basketballs from the Knicks championship teams. Julian sips tequila and is on the phone talking and scratching off names on a list."],["cue","JULIAN (V.O.)"],["dialogue","My dad wasn't talking. My mom couldn't. So I went looking for the one person who might fill in some of the blanks."],["cue","JULIAN"],["dialogue","Did you say no one by that name lives there or someone? Oh, okay. Thank you for your time."],["action","He scratches out a number and dials another. (they should all be 516 or 212 or 914 area codes and 555-01(any two numbers)"],["cue","JULIAN  (CONT’D)"],["dialogue","Jennifer Smith please..."],["action","Disappointed Julian gets in bed and goes to sleep"]]},{"id":"47","page":"51","pages":"51","slug":"EXT. WESTBURY, LONG ISLAND, NEW YORK - NIGHT","ie":"EXT","loc":"WESTBURY, LONG ISLAND, NEW YORK","time":"NIGHT","omitted":false,"summary":"Flashback: Jennifer Smith waves outside the cemetery; quick cuts of the family outside the house, firemen and horrified neighbours.","old":false,"lead":"","who":[],"el":[["action","Flashback - (reuse existing footage)Jennifer Smith waving in front of the cemetery. Quick cuts of family outside home; Firemen Horrified neighbors watching"]]},{"id":"48","page":"51","pages":"51","slug":"INT. JULIAN'S APARTMENT - NIGHT","ie":"INT","loc":"JULIAN'S APARTMENT","time":"NIGHT","omitted":false,"summary":"Julian wakes hyperventilating and writes in his journal; a passing fire siren's red lights bring flashes of Westbury fire engines and tombstones.","old":false,"lead":"","who":[],"el":[["action","Julian pops up in bed hyperventilating turns on the light. As he writes in his journal he is jarred by a loud fire siren as the red flashing lights illuminate Julian’s face through the venetian blinds. FLASH Westbury Fire engines. Rows of tombstones flash by."]]},{"id":"49","page":"51","pages":"51","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"50","page":"52","pages":"52–54","slug":"EXT. GUCCI STORE - DAY","ie":"EXT","loc":"GUCCI STORE","time":"DAY","omitted":false,"summary":"In the stockroom Julian instantly works out Spoon's commission and Mauro's stock count, but seems scattered. Sophia's sputtering steamer sets off a flashback of Lenny ironing.","old":false,"lead":"","who":["Spoon","Julian","Lenny","Mauro"],"el":[["action","Stock room. Julian walks in and sees Spoon doing math on a piece of paper as Sophia steams Floral Print dresses."],["cue","SPOON"],["dialogue","Okay...487 plus 399 - carry the 1"],["cue","JULIAN"],["dialogue","886 dollars at 7% - $62.02. Not bad commission for a day's work."],["cue","SPOON"],["dialogue","I'm sorry?"],["cue","JULIAN"],["dialogue","$62.02 - that's your commission."],["cue","SPOON"],["dialogue","I've spent five minutes on this."],["cue","JULIAN"],["dialogue","You're welcome."],["action","Spoon checks the math."],["cue","SPOON"],["dialogue","I hate you. You might be in the wrong business, Einstein."],["action","Julian grabs six boxes of shoes."],["cue","SPOON  (CONT’D)"],["dialogue","Hey man, those are the tennis sneakers. We got those on the floor already. I said Horsebit Loafers."],["action","Julian opens another box."],["cue","JULIAN"],["dialogue","Oh, man. I'm sorry."],["cue","SPOON"],["dialogue","What's wrong Jules?"],["cue","JULIAN"],["dialogue","I don't know, man...just scattered I guess."],["cue","SPOON"],["dialogue","You know what your problem is?"],["cue","JULIAN"],["dialogue","I got a problem?"],["cue","SPOON"],["dialogue","Yeah. You think too much."],["cue","JULIAN"],["dialogue","What are you talking about?"],["cue","SPOON"],["dialogue","You never relax. You never enjoy. Exhale, man. Live in the present. You're always chasing what’s next."],["cue","JULIAN"],["dialogue","I just keep waiting for it to all click...But it never clicks."],["cue","SPOON"],["dialogue","It'll click eventually but just not all at once. But what do I know? I sell shoes and tell jokes."],["cue","JULIAN"],["dialogue","You ever feel like if you stop moving, something catches up to you?"],["action","Spoon looks at him. Sophia's steamer is running out of water and begins spitting/sputtering"],["cue","SPOON"],["dialogue","Not really."],["trans","FLASH TO:"],["action","Flashback of Lenny ironing and spitting steam onto his shirt:"],["cue","LENNY"],["dialogue","...and what do you do? You sell to the masses -"],["action","Back to stockroom."],["cue","JULIAN"],["dialogue","...and dine with the classes"],["cue","SPOON"],["dialogue","Dine with what?"],["cue","JULIAN"],["dialogue","Huh?"],["cue","SPOON"],["dialogue","You okay?"],["action","Mauro approaches a shelf with boxes with a clipboard."],["cue","MAURO"],["dialogue","Guys, guys - I am reordering today. Do you know how many Blondie Bags we have left?"],["cue","JULIAN"],["dialogue","Thirty seven."],["cue","MAURO"],["paren","(counting)"],["dialogue","Four-eight-sixteen-thirty two, three, four five six SEVEN! How do you do it?"],["cue","JULIAN"],["dialogue","You hired me for a reason, Mauro!"],["cue","MAURO"],["dialogue","Amazing....thanks!"],["action","Mauro struts off..."],["cue","SPOON"],["dialogue","Go easy, man. You’ll be fine."]]},{"id":"51","page":"54","pages":"54","slug":"EXT. JULIAN'S APARTMENT - NIGHT","ie":"EXT","loc":"JULIAN'S APARTMENT","time":"NIGHT","omitted":false,"summary":"Establishing shot of Julian's Alfa parked outside his apartment at night.","old":false,"lead":"","who":[],"el":[["action","Establishing - Julian's Alfa parked outside in a spot."]]},{"id":"52","page":"54","pages":"54–56","slug":"INT. JULIAN'S APARTMENT - LATER","ie":"INT","loc":"JULIAN'S APARTMENT","time":"LATER","omitted":false,"summary":"Julian keeps calling Jennifer Smiths and tells Candace he's phoning his dad. She urges him to see a campus counselor; he agrees to one session, and they dance.","old":false,"lead":"","who":["Julian","Candace"],"el":[["action","The bathroom door is closed but we hear the sound of the shower. Julian dials another Jennifer Smith number."],["cue","JULIAN"],["dialogue","Yeah, hi. I'm looking for Jennifer Smith...I see. Okay sorry."],["action","Julian hangs up and looks at a framed photo of Andrew and him goofing off. FLASH: Andrew flashback/Tombstones/Firetruck Sirens/ Julian exhales deeply. Dials another number. Ringing. Candace walks into the kitchen in lingerie drying her hair."],["cue","CANDACE"],["dialogue","I can't believe the waitress spilled wine all over me...Oh sorry - Who are you calling?"],["action","He hangs up, his eyes widen then close hard."],["cue","JULIAN"],["dialogue","Ah, my dad...but I think maybe I should wait."],["cue","CANDACE"],["dialogue","That wasn't easy the other night."],["cue","JULIAN"],["dialogue","No...my family is complicated."],["cue","CANDACE"],["dialogue","It's more than that. You don't sleep. You have those dreams. And every time something gets close to whatever this is, you change the subject. Maybe you should talk to someone."],["action","Julian gets uncomfortable."],["cue","JULIAN"],["dialogue","You want me to lay on a couch and blame my mother?"],["cue","CANDACE"],["dialogue","Come on, Julian. There are counselors on campus who can help."],["cue","JULIAN"],["dialogue","I'm fine."],["cue","CANDACE"],["dialogue","Go once and if you don't find it helpful I won't push you to go again."],["action","Julian thinks about it. Candace is really being sincere."],["cue","JULIAN (V.O.)"],["dialogue","Candace really was a dream in every way, and I knew whoever ended up with her would be a lucky man. There was nothing wrong with Candace. The problem was me. I wasn't mature enough to be that man"],["cue","JULIAN"],["dialogue","Okay. Mr. \"I'm Fine\" will try one session. But that's all I'm promising."],["cue","CANDACE"],["dialogue","That's great, Mr. I'm fine..."],["action","Candace turns up the volume."],["cue","CANDACE   (CONT’D)"],["dialogue","Now dance with me."],["cue","JULIAN"],["dialogue","Come on, Candace. I don't feel like it."],["cue","CANDACE"],["dialogue","That's exactly the reason to dance! Come on, you're not going to leave a girl all alone on the dance floor are you?"],["action","Candace moves and Julian appreciates not only her beauty but the fact she is trying to connect with him on a deep level. He can't help let a smile escape from his inner conflict."],["cue","CANDACE   (CONT’D)"],["paren","(sexy tone)"],["dialogue","Dance with me."],["action","Candace extends her hand. Julian takes it and they wrap their arms around each other in the most loving and comforting way. They close their eyes and drift off together in the song."]]},{"id":"53","page":"56","pages":"56","slug":"EXT. JULIAN'S APARTMENT - NIGHT","ie":"EXT","loc":"JULIAN'S APARTMENT","time":"NIGHT","omitted":false,"summary":"Julian and Candace's silhouettes dance behind the drapes until Candace leads him to bed and the lights go out.","old":false,"lead":"","who":["Candace"],"el":[["action","The couple’s silhouette can be seen through the drapes as they dance."],["cue","CANDACE (O.S.)"],["dialogue","Come to bed."],["action","Candace's silhouette leads Julian to the bedroom. Lights out."]]},{"id":"54","page":"56","pages":"56–60","slug":"INT. JULIAN'S APARTMENT - DAY","ie":"INT","loc":"JULIAN'S APARTMENT","time":"DAY","omitted":false,"summary":"Lenny confronts Julian: UCLA has no record of him. He won't tell Barbara but orders him back on track. Julian confesses the Gucci job; Lenny still wants him to take over.","old":false,"lead":"","who":["Julian","Lenny"],"el":[["action","Julian on phone drinking coffee scratches out another Jennifer Smith number and dials another. Disconnected. A knock at the door. Julian answers. It's Lenny."],["cue","JULIAN"],["dialogue","Dad - what are you doing here?"],["cue","LENNY"],["dialogue","Was passing through. Thought we should talk. You doing okay?"],["cue","JULIAN"],["dialogue","Yeah, sure. Oh and sorry about the other night again."],["cue","LENNY"],["dialogue","You already apologized."],["cue","JULIAN"],["dialogue","I know, but it was insensitive."],["cue","LENNY"],["dialogue","Julian, we move forward, remember?"],["cue","JULIAN"],["dialogue","Yeah...right. Okay."],["cue","LENNY"],["dialogue","So what are you up to today?"],["cue","JULIAN"],["dialogue","Oh, was just studying for a final."],["cue","LENNY"],["dialogue","You know what I've always liked about you, Julian?"],["cue","JULIAN"],["dialogue","What's that?"],["cue","LENNY"],["dialogue","When you commit to something, you commit."],["action","Julian smiles."],["cue","LENNY  (CONT’D)"],["dialogue","At least I thought you did."],["action","Julian's smile vanishes."],["cue","JULIAN (V.O.)"],["dialogue","And there it was. I miscalculated. My father was onto me...and I was thrown."],["cue","LENNY"],["dialogue","I called U.C.L.A. to get a copy of your summer classes. They have no record of you being enrolled."],["action","An uncomfortable beat as Julian tries to think of a response."],["cue","JULIAN"],["dialogue","I...I..."],["cue","LENNY"],["dialogue","Don't lie to me."],["action","A defeated Julian looks down."],["cue","LENNY  (CONT’D)"],["dialogue","I don't know what you've been doing all summer and I don't care...I just want you to get right."],["cue","JULIAN"],["dialogue","I will. I am. I just, I'm figuring it all out."],["cue","LENNY"],["dialogue","I'm not telling your mother. This is between me and you. She doesn't need the stress...but you are going to fix this."],["action","Julian shakes his head agreeing with the logic."],["cue","LENNY  (CONT’D)"],["dialogue","You WILL take extra units next quarter to make up for the classes missed, and you WILL get back on schedule. Do you understand?"],["cue","JULIAN"],["dialogue","Yes. One hundred percent."],["cue","LENNY"],["dialogue","I split the car lease because you showed me you could handle the responsibility. You don't get yourself back on schedule, the Alfa is gone. Am I clear?"],["cue","JULIAN"],["dialogue","I got it..."],["cue","LENNY"],["dialogue","One more thing. I went into Hamburger Hamlet for a patty melt from my favorite waiter. They told me you quit."],["cue","JULIAN"],["dialogue","Dad - I should have told you that I got a different job."],["cue","LENNY"],["dialogue","Where?"],["cue","JULIAN"],["dialogue","Gucci on Rodeo"],["cue","LENNY"],["dialogue","Gucci? Why? You were making good tips at Hamlet and it's right near campus in the village."],["cue","JULIAN"],["dialogue","I know, but I did the math."],["cue","LENNY"],["dialogue","Of course you did."],["cue","JULIAN"],["dialogue","Dad, they both pay minimum wage but the commissions at Gucci are netting me four and a half times more than the tips from Hamlet."],["action","Lenny takes it in, impressed."],["cue","LENNY"],["dialogue","That's not bad, kid. But why didn't you just tell me?"],["cue","JULIAN"],["dialogue","I don't know. I thought maybe you'd disapprove."],["cue","LENNY"],["dialogue","Julian - you can tell me anything. You're a smart kid. I love you. You have a good head on your shoulders which is why I want you to eventually take over the business."],["cue","JULIAN (V.O.)"],["dialogue","It was one of the few times in my life I had no snappy words to defuse the situation. Only a tight feeling in my chest. Part of me wished I wanted the same things my pop wanted."],["cue","JULIAN"],["dialogue","You're right, dad. I should've told you."],["cue","LENNY"],["dialogue","We'll figure the rest out later. Don't lose sight of how great we have it. Most of the world is struggling. We're very lucky."],["cue","JULIAN"],["paren","(sincere)"],["dialogue","We really are."],["paren","(considering)"],["dialogue","Dad, I don't think I've ever said this, but I'm really proud and thankful for everything you've done for me and the family. I really am."],["cue","LENNY"],["dialogue","Good. Now figure out what you need to get back on track. I have to get to work. I love you."],["cue","JULIAN"],["dialogue","I love you too, pop."],["action","They hug and Lenny leaves. Julian is exposed."]]},{"id":"55","page":"60","pages":"60","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"56","page":"60","pages":"60","slug":"EXT. THE COMEDY STORE - NIGHT","ie":"EXT","loc":"THE COMEDY STORE","time":"NIGHT","omitted":false,"summary":"Establishing: crowds queue on Sunset Boulevard under the Comedy Store's neon marquee, billing Richard Pryor and Robin Williams tonight.","old":false,"lead":"","who":[],"el":[["action","Sunset Blvd. Lines of people waiting to get in. Neon lights. Establishing as the marquee in the background displays: TONIGHT: RICHARD PRYOR ROBIN WILLIAMS and TOMORROW: JIMMY WALKER ANDY KAUFMAN"]]},{"id":"57","page":"60","pages":"60–62","slug":"INT. THE COMEDY STORE - NIGHT","ie":"INT","loc":"THE COMEDY STORE","time":"NIGHT","omitted":false,"summary":"Spoon MCs to big laughs and joins Julian and Elin at the VIP table. In a montage, Spoon introduces Richard Pryor and the pair laugh until they cry.","old":false,"lead":"","who":["Spoon","Julian","Elin"],"el":[["action","The current comic wraps up as Spoon bounds onto the stage."],["cue","SPOON"],["dialogue","Give it up one more time for Danny Page! That's what I'm talking about! How's everybody doing tonight? Y'all look good tonight...Well...Most of y'all."],["action","Big laugh."],["cue","SPOON  (CONT’D)"],["dialogue","I just bought me a used Cadillac. Thing so old the steering wheel don't steer, it's negotiates. Hit one pothole on Sunset Boulevard. Radio changed stations...glove box flew open... and one of my hubcaps passed me o(MORE)(MORE)n the left."],["dialogue","I asked the man I bought it from, \"Does it have brakes?\" He said, \"If you hit something big enough it'll stop.\""],["action","Huge laugh. Spoon points toward a guy in the audience."],["cue","SPOON  (CONT’D)"],["dialogue","And look at all these Hollywood outfits...Platform shoes this high...Brother...you fall tonight - we'll see you sometime Tuesday."],["action","Bigger laugh."],["cue","SPOON  (CONT’D)"],["dialogue","Alright...Let's keep this party rolling. Y'all put your hands together...from Lincolnwood Illinois, Mr. Barry Trucktin!"],["action","Spoon hands off the mic and approaches the VIP Table with Julian and Elin."],["cue","SPOON  (CONT’D)"],["dialogue","My people! What up Julian?"],["cue","JULIAN"],["dialogue","You're killing..."],["cue","SPOON"],["dialogue","Too kind. Girl, how did he get you get you to go out with him?"],["action","Elin laughs."],["cue","ELIN"],["dialogue","He does not give up..."],["trans","A QUICK MONTAGE:"],["action","Spoon roasting another table to huge laughter. A waitress delivers drinks to Julian and Elin. Another comic kills. Spoon introduces Richard Pryor. Julian and Elin laugh until they cry. The packed Comedy Store buzzes with energy."],["cue","JULIAN (V.O.)"],["dialogue","At The Comedy Store, we got treated like royalty. It was definitely one of the perks of having Spoon as a best friend. The other perk was the talent. Letterman. Leno. Pryor. Williams. (MORE)(MORE)"],["dialogue","On any given night you could end up ten feet from greatness."]]},{"id":"58","page":"62","pages":"62","slug":"EXT. THE COMEDY STORE - NIGHT","ie":"EXT","loc":"THE COMEDY STORE","time":"NIGHT","omitted":false,"summary":"Outside the Comedy Store, the valet helps Julian and Elin into the Alfa and closes the door.","old":false,"lead":"","who":[],"el":[["action","Julian and Elin enter the Alfa with help from the valet. The valet closes the door and we SMASH CUT TO:"]]},{"id":"59","page":"62","pages":"62","slug":"EXT. PIPS WEST HOLLYWOOD - NIGHT","ie":"EXT","loc":"PIPS WEST HOLLYWOOD","time":"NIGHT","omitted":false,"summary":"The valet at Pips lets Julian and Elin out. Elin says she has fun with him, but when he leans in to kiss her she offers her cheek.","old":false,"lead":"","who":["Elin","Julian"],"el":[["action","Match cut on door from Prev. Shot but valet at Pips opens door and Julian and Elin hop out and he takes her hand. Elin smiles at Julian."],["cue","ELIN"],["dialogue","I have fun with you, Julian."],["cue","JULIAN"],["dialogue","Me too..."],["action","Julian moves in for a kiss but Elin points to her cheek and Julian kisses it, respecting the first date boundary."]]},{"id":"60","page":"62","pages":"62","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"61","page":"62","pages":"62","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"A62","page":"62","pages":"62","slug":"INT. JULIAN'S APARTMENT - NIGHT","ie":"INT","loc":"JULIAN'S APARTMENT","time":"NIGHT","omitted":false,"summary":"Julian comes home smiling and writes in his journal, in voice-over, about his night out with a Playmate and Spoon's big breakthrough, then goes to bed.","old":false,"lead":"","who":["Julian"],"el":[["action","Julian walks in smiling. He kicks off his shoes and sits on the bed, pulls out his journal and starts writing."],["cue","JULIAN (V.O.)"],["dialogue","What a night. I just went out with a Playmate of the year. I mean wow. I also was happy for Spoon’s big breakthrough. He was great. But who’d a thought that me, Julian, Jules, the big J himself spent a night on the town with a Playmate."],["action","Julian sets down his journal turns off the light and goes to bed."]]},{"id":"62","page":"62","pages":"62–63","slug":"EXT. FOREST - NIGHT","ie":"EXT","loc":"FOREST","time":"NIGHT","omitted":false,"summary":"In a nightmare, someone runs through a smoky, moonlit forest after a small figure. A casket is lowered; in a flashback, Barbara screams for Andrew and Lenny says he's gone.","old":false,"lead":"","who":["Barbara","Lenny"],"el":[["action","Steadicam POV running through a thick forest at night, moonlight illuminating a path. Breathing is heard."],["action","Smoke obscures the path but a small figure is seen running away from camera. A casket is being lowered into the ground. FLASHBACK: WEISS HOME"],["cue","BARBARA"],["dialogue","ANDREW!!!!!"],["cue","LENNY"],["dialogue","Barbara HE'S GONE!!"],["cue","BARBARA"],["dialogue","My baby's in there!"],["cue","LENNY"],["dialogue","Barbara, He's Gone!"]]},{"id":"63","page":"63","pages":"63","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"64","page":"63","pages":"63","slug":"INT. JULIAN'S APARTMENT - DAY","ie":"INT","loc":"JULIAN'S APARTMENT","time":"DAY","omitted":false,"summary":"Julian wakes in a cold sweat again. In voice-over he admits things are getting worse: a girlfriend, a model, a fake school schedule, nightmares and his hunt for Jennifer Smith.","old":false,"lead":"","who":["Julian"],"el":[["action","Julian's alarm blares as again he sits up in a cold sweat."],["cue","JULIAN (V.O.)"],["dialogue","It was getting worse. I kept telling myself I was figuring things out. In reality, I was mostly making them worse. I had a girlfriend, a model, a fake college schedule, recurring nightmares, and a growing obsession with finding Jennifer Smith. My hunch was the answers to my future were hiding somewhere in my past."]]},{"id":"65","page":"63","pages":"63–64","slug":"EXT. HOUSE IN THE HILLS - NIGHT","ie":"EXT","loc":"HOUSE IN THE HILLS","time":"NIGHT","omitted":false,"summary":"Julian and Spoon, dressed to the nines, arrive at a party where Victoria's friends will be. Spoon says they'll get lucky or get in trouble; Julian bets on lucky.","old":false,"lead":"","who":["Julian","Spoon"],"el":[["action","Julian and Spoon are dressed to the 9's. Julian wears his patchwork denim suit with the white, long point collar, shirt unbuttoned with gold chains dangling from his neck. Spoon in a hip suit with a classic hat accent. Walking up the driveway"],["cue","JULIAN"],["dialogue","Man you killed it last night. You replacing Letterman now?"],["cue","SPOON"],["dialogue","Are you crazy? Shit, I'll just be happy if I can get regular time up there with the big boys. Who all is gonna be here again?"],["cue","JULIAN"],["dialogue","No clue, except that any friends of Victoria's should be friends of ours. Trust me."],["cue","SPOON"],["dialogue","I don't know man - we're either getting lucky or we're in trouble."],["action","Julian reaches over and rings the bell."],["cue","JULIAN"],["dialogue","I'm going with getting lucky."]]},{"id":"66","page":"64","pages":"64–69","slug":"INT. DINING ROOM - HOUSE IN THE HILLS - CONTINUOUS","ie":"INT","loc":"DINING ROOM - HOUSE IN THE HILLS","time":"CONTINUOUS","omitted":false,"summary":"Julian, Spoon, Victoria and her co-host Anna, the woman from Pips, take LSD. Julian hallucinates a boy at a fork and declares his love; Anna turns him down, then kisses him.","old":false,"lead":"","who":["Julian","Spoon","Victoria","Anna"],"el":[["action","The door opens and they enter the dining room, and its instant party. 70's Hollywood Hills in full swing. The fashion, the music, the hair! Music thumping and slo motion of Victoria smiling and waving and wearing a hostess costume among a house full of revelers. Chatting, dancing, smoking, drinking and noshing. Kissing, grinding in a sensual psychedelic gathering at Club Hedonism. Caterers with trays are making the rounds. Julian spots HER approaching Victoria wearing the same hostess costume."],["cue","JULIAN"],["dialogue","No fucking way."],["cue","SPOON"],["dialogue","What's up?"],["cue","JULIAN"],["dialogue","It's the girl from the Pips."],["cue","SPOON"],["dialogue","Take it easy, Valentino. Which one? I mean, help a brother out."],["cue","JULIAN"],["dialogue","The first night we ever went. Remember the older sexy one? That's her - with Victoria. We had a moment together."],["action","Spoon sees the two women chatting."],["cue","SPOON"],["dialogue","So that's the one she's throwing the party with?"],["cue","JULIAN"],["dialogue","Must be - which means she's Farrah Fawcett's cousin."],["cue","SPOON"],["dialogue","She does look just like Farrah."],["cue","JULIAN (V.O.)"],["dialogue","Out of ALL the dinner party joints."],["paren","(beat)"],["dialogue","Victoria and Anna approach the boys. Victoria double-kisses the guys on the cheek."],["cue","VICTORIA"],["paren","(to Anna)"],["dialogue","These are my partners in crime, Julian and Spoon - at the most posh place in this grimy, culture-less town - Gucci! Boys - meet Anna."],["cue","ANNA"],["dialogue","Hi boys..."],["cue","JULIAN"],["dialogue","I think we met at Pips a while back."],["cue","ANNA"],["dialogue","No, I don't think we met."],["action","Julian gently bumps his shoulder into her."],["cue","JULIAN"],["dialogue","Yeah - I bumped into you on the dance floor and you said I'd have to bump into you again to get your name."],["cue","ANNA"],["dialogue","Not sure I remember that..."],["action","A caterer comes by with a tray full of shots on saucers with a tab of LSD on the saucer. Victoria and Anna each grab one and hand them to the boys and then get one each for themselves."],["cue","VICTORIA"],["dialogue","Bottoms up, boys."],["cue","SPOON"],["dialogue","What is this?"],["cue","VICTORIA"],["dialogue","Tequila."],["cue","SPOON"],["paren","(pointing to the LSD)"],["dialogue","No, I mean what is this??!"],["cue","VICTORIA"],["dialogue","That's Mellow Yellow..."],["action","Spoon and Julian look at each other."],["cue","VICTORIA   (CONT’D)"],["dialogue","Lucy in the Sky with Diamonds???"],["cue","SPOON & JULIAN"],["dialogue","OHHHHHHHH.....okay."],["action","The women put the tabs on their tongues and the boys follow suit. They raise their shot glasses up and toast."],["cue","VICTORIA"],["dialogue","To an amazing night..."],["action","The four knock back their shots and exhale."],["action","MONTAGE SEQUENCE"],["action","Strobe lights, music thumping, couples kissing and dancing, candles, guests surround the pool overlooking the city. The room has beanbag chairs and meditation pillows placed around. It has a temple/harem/genie bottle type vibe. Cool rugs and lamps set the tone. Julian and Anna are on the dance floor."],["cue","JULIAN"],["dialogue","I can't believe it's you."],["cue","ANNA"],["dialogue","What do you mean?"],["cue","JULIAN"],["dialogue","I mean - we work with Victoria and she told us she was throwing this party with someone else and I just never thought it could be the mystery woman that captured my heart at PIPS..."],["cue","ANNA"],["dialogue","I captured your heart?"],["cue","JULIAN"],["dialogue","Almost completely."],["cue","ANNA"],["dialogue","Who writes your material? We exchanged eye contact and a minor undressing with the eyes across a crowded night club."],["cue","JULIAN"],["dialogue","Aha...."],["cue","ANNA"],["dialogue","What?"],["cue","JULIAN"],["dialogue","So we did meet after all! Section 5 Line 4 states clearly that any undressing with the eyes meets the threshold for an interaction to be classified as having met."],["cue","ANNA"],["dialogue","You're good...I guess we have to concede. We met."],["cue","JULIAN"],["dialogue","I try!"],["cue","ANNA"],["paren","(winks)"],["dialogue","You win."],["action","Julian see Anna's gorgeous smile and body glowing in an angelic fashion with flashing strobe lights and a packed floor of other party guests who are all \"feeling good.\""],["cue","JULIAN"],["dialogue","This stuff is really strong. Are you feeling it?"],["cue","ANNA"],["dialogue","A little - I feel good."],["cue","JULIAN"],["dialogue","I'm thirsty."],["cue","ANNA"],["dialogue","Let's get some water and fresh air..."],["cue","JULIAN"],["dialogue","Yeah...."],["action","Anna leads the clearly more stoned Julian outside to a lounge by the pool and sits him down before grabbing two glasses of water from the bar next to them. Anna hands the cup to Julian who sips the water as if he's been in the desert for days."],["cue","JULIAN  (CONT’D)"],["dialogue","Wow. I was really thirsty."],["cue","ANNA"],["dialogue","All better. You're welcome..."],["action","Julian is all smiles as he gazes at the beautiful Anna. His vision of her turns to his view of the stars which dissolves into a hallucinatory trip. Julian sees a winding path. At a fork stands a young boy. Unable to choose. The boy turns toward him but smoke obscures the face. Julian wakes up in the arms of Anna, her hands massaging his shoulders, her cheek pressed warmly against Julian's."],["cue","ANNA  (CONT’D)"],["dialogue","You okay, handsome?"],["cue","JULIAN"],["dialogue","Yeah...I haven't been able to stop thinking about you since the moment I saw you at Pips."],["cue","ANNA"],["dialogue","And why is that?"],["cue","JULIAN"],["dialogue","I...you seem like you could see through me."],["cue","ANNA"],["dialogue","Is that so?"],["action","Julian is surprised by his response but doesn't take it back."],["cue","JULIAN"],["dialogue","Yes. You have such a unique energy and personality. I'm so glad you're here with me now. I think I may be in love with you..."],["cue","ANNA"],["dialogue","Julian - how old are you?"],["cue","JULIAN"],["dialogue","Uh, Twenty-five."],["cue","ANNA"],["dialogue","You're still a baby...and I mean that in a loving way. You have your whole life in front of you."],["cue","JULIAN"],["dialogue","I know what I want."],["cue","ANNA"],["dialogue","You're very good at making people think you know exactly what you want."],["cue","JULIAN"],["dialogue","I usually do."],["cue","ANNA"],["dialogue","No. You usually know what you want next. I worked too hard to build my life to make somebody else the center of it."],["cue","JULIAN"],["dialogue","Wouldn't we be a great couple?"],["cue","ANNA"],["dialogue","As Tevye said - A bird and a fish could fall in love but where would they build a home together?"],["cue","JULIAN"],["dialogue","You’re the hottest person in human history to quote Tevye."],["cue","ANNA"],["dialogue","Life is short. You need someone to take care of - not someone to take care of you."],["cue","JULIAN"],["dialogue","But, I..."],["cue","ANNA"],["dialogue","Ssshhh....come here."],["action","Anna gives a knowing smile, and kisses him gently on the lips. They embrace deeply and melt into one another."]]},{"id":"67","page":"69","pages":"69–72","slug":"EXT. HOUSE IN THE HILLS - DAWN","ie":"EXT","loc":"HOUSE IN THE HILLS","time":"DAWN","omitted":false,"summary":"Julian and Spoon wake by the pool. Spoon ribs him about Candace, Elin, Dawn and Anna and warns him to sort it out before everyone gets hurt.","old":false,"lead":"","who":["Spoon","Julian"],"el":[["action","Julian and Spoon wake up on lounge chairs by the pool."],["dialogue","JULIAN"],["action","Spoon - you awake?"],["dialogue","SPOON"],["action","Awake but tired from traveling deep into Rod Serling’s Twilight Zone."],["dialogue","JULIAN"],["action","Right?"],["dialogue","SPOON"],["action","Rock the boat but don't tip the damn boat over! You better watch yourself Benjamin Jr..."],["dialogue","JULIAN"],["action","Benjamin Jr? What?"],["dialogue","SPOON"],["action","The Graduate? Elin last night - now you're drooling over Mrs. Robinson,"],["dialogue","JULIAN"],["action","Come on, man..."],["dialogue","SPOON"],["action","Let's not forget Dawn from the Pips women's room - stall number three was it? And then we have Candace - marriage material or daytime soap opera?"],["dialogue","JULIAN"],["action","First of all last night was a first date with Elin - so we aren't screwing."],["dialogue","SPOON"],["action","Oh? My bad! - I'll put her in \"training camp\" but not on the official roster yet."],["dialogue","SPOON (CONT’D)"],["action","You gotta figure your shit out or everyone is gonna get messed up...you included."],["dialogue","JULIAN"],["action","I know. You're probably right."],["dialogue","SPOON"],["action","Man, I am right! And you look like shit, which I know is what you probably care about most."],["dialogue","JULIAN"],["action","Fuck you! I look good."],["dialogue","SPOON"],["action","What do you think you're gonna do, for real? Candace is like waiting for you, isn't she?"],["dialogue","JULIAN"],["action","I mean kind of. I don't know. Well, yeah...she's looking toward the future. I'm just not ready."],["dialogue","SPOON"],["action","And what about that Dawn from Pips?"],["dialogue","JULIAN"],["action","Like Elton John at the Troubadour - it was \"one night only.\""],["dialogue","SPOON"],["action","Okay and this Elin? You seem to like her."],["dialogue","JULIAN"],["action","What's not to like, Spoon - she's Playmate of the Year!"],["dialogue","SPOON"],["action","Okay. But does she connect with you in a soulful spiritual way...looks will fade ya know - that's why my ass won't have to worry."],["dialogue","JULIAN"],["action","I'll take the bait, why?"],["dialogue","SPOON"],["action","I just read a study that proves that women explicitly rank a sense of humor over physical looks."],["dialogue","JULIAN"],["action","So..."],["dialogue","SPOON"],["action","So when all you pretty boys age out I'm gonna be beating them off with a stick."],["dialogue","JULIAN"],["action","You're crazy."],["cue","SPOON"],["dialogue","Maybe. Also black people don’t wrinkle up like y’all do."],["cue","JULIAN"],["dialogue","Did I tell you that Elin said she thinks you are actually funny?"],["action","Spoon looks at him as if to say \"for real?\" Julian nods."],["cue","JULIAN  (CONT’D)"],["dialogue","Says you have the \"it\" factor."],["action","Spoon spits out the water loudly and grabs Julian's arm - raising it like a prize fighter."],["cue","SPOON"],["paren","(loud announcer voice)"],["dialogue","Folks, we have a winner! I choose Elin! You don't have to choose anybody today. But you better figure out what you're telling all of them."],["action","On Julian's look to Spoon we cut..."]]},{"id":"68","page":"72","pages":"72–75","slug":"INT. ITALIAN RESTAURANT\" - NIGHT","ie":"INT","loc":"ITALIAN RESTAURANT\"","time":"NIGHT","omitted":false,"summary":"Over dinner Candace reveals she knows Julian sells at Gucci and is angry he hid it. She offers a restart, wants to get engaged, and warns: no more secrets.","old":false,"lead":"","who":["Candace","Julian"],"el":[["action","Pictures of movie stars lining the walls. Red and white checkered tablecloths cover every table. Julian and Candace sit across from each other, sipping cocktails. Candace eyes Julian looking uneasy. She finally puts the menu down."],["cue","CANDACE"],["dialogue","What's going on with you? You seem out of it. Haven't said a word all night."],["action","Julian takes back her hand."],["cue","JULIAN"],["dialogue","I'm sorry. Allergy pill makes me a little drowsy plus I had a strange conversation with my dad the other day. Just distracted I guess."],["action","Candace sits back a bit colder."],["cue","CANDACE"],["dialogue","About what?"],["cue","JULIAN"],["dialogue","About him wanting me to take over the business."],["cue","CANDACE"],["dialogue","Oh...isn't that what you want? I mean, you've always talked about it as a possibility."],["cue","JULIAN"],["paren","(vulnerable moment)"],["dialogue","I know. I just didn't know he would want me to do it so soon."],["cue","CANDACE"],["dialogue","It's not like you have to do it this minute...And it's not like you're gonna sell shoes at Gucci forever. That's a dead end."],["action","Julian's eyes shift. She knows about Gucci. Candace picks up her drink and doesn't blink, unwavering, wondering when he will catch on to what she just said."],["cue","JULIAN (V.O.)"],["dialogue","And there it was. I'd spent months keeping my Gucci life and my real life in separate boxes. Candace had just opened both."],["action","Julian tries to reach out and touch her hand."],["cue","CANDACE"],["dialogue","Julian, my roommate was shopping in Beverly Hills last week and saw you selling shoes at Gucci. That explains why you haven't been going to class."],["action","Candace flashes him a look we haven't seen."],["cue","CANDACE  (CONT’D)"],["dialogue","Do you think I'm an idiot?"],["cue","JULIAN"],["dialogue","Of course not."],["cue","CANDACE"],["dialogue","Why couldn't you have just told me? I would have been so happy for you. I don't understand."],["cue","JULIAN (V.O.)"],["dialogue","And that's when I knew. The problem was never Gucci. The problem was me. Candace wasn't angry about the job. She was angry that I hid it."],["cue","CANDACE"],["dialogue","Julian?"],["cue","JULIAN"],["dialogue","Because I knew what everyone was going to say. Finish school. Stay on track. Don't get distracted. And I didn't want to hear it."],["cue","CANDACE"],["dialogue","Look at your outfit. Look at the one you bought me. Gucci isn't just a job to you, Julian. It's who you are. I would've loved to share that with you. Instead, you hid it from me."],["action","Julian is at a loss."],["cue","CANDACE  (CONT’D)"],["dialogue","I love you, Julian and if you love Gucci - then I love the guy that loves Gucci. But you just need to stop, Julian..."],["action","She puts her hair behind her ears."],["cue","JULIAN"],["dialogue","Stop what?"],["cue","CANDACE"],["dialogue","Running. From me...from your dad. From school. Just be where you are for once. Try being present."],["cue","JULIAN"],["dialogue","I'm trying."],["cue","CANDACE"],["dialogue","Then start here, now - because if you don't, it's going to catch up with you one day."],["cue","JULIAN"],["dialogue","I think you're right."],["cue","CANDACE"],["dialogue","Then let's toast to a restart."],["cue","JULIAN"],["dialogue","I'd like that."],["cue","CANDACE"],["dialogue","Then, I'm willing."],["cue","CANDACE   (CONT’D)"],["dialogue","To a restart."],["cue","JULIAN"],["paren","(sheepishly)"],["dialogue","Cheers. To moving forward."],["action","Candace and Julian toast and sip."],["cue","JULIAN (V.O.)"],["dialogue","A do-over seemed so undeserved, but it was also something I couldn't turn down."],["cue","CANDACE"],["dialogue","Summer is almost over, and our plan was to be engaged by now."],["cue","JULIAN (V.O.)"],["dialogue","I knew she was leaning toward that but I honestly couldn't remember when we really talked about a deadline for engagement."],["action","Julian puts his hands on hers again."],["cue","JULIAN"],["dialogue","I know, baby. Like I said... I just need a little time to..."],["action","Candace smiles and puts her finger over his mouth."],["cue","CANDACE"],["dialogue","Shhh. I can't take another conversation about needing time. We have time...and it's now. Like, right now. But no more secrets, Julian. I won't tolerate them."],["action","Move in on Julian's face."]]},{"id":"69","page":"75","pages":"75–77","slug":"INT. JULIAN'S APARTMENT - DAY","ie":"INT","loc":"JULIAN'S APARTMENT","time":"DAY","omitted":false,"summary":"Montage: Julian keeps calling Jennifer Smiths between flashes of the fire, and promises Barbara he'll come to Sunday breakfast. He finally gets a number and pins it to the fridge.","old":false,"lead":"","who":["Julian","Barbara"],"el":[["action","Montage A legal pad crossing out phone numbers. The journal lays nearby, open and written in."],["cue","JULIAN"],["dialogue","Thank you for your time."],["action","Click. Another number."],["cue","JULIAN  (CONT’D)"],["dialogue","Hi, I'm trying to locate a Jennifer Smith."],["action","Click. The phone rings."],["cue","JULIAN  (CONT’D)"],["dialogue","Hello?"],["cue","BARBARA (O.S.)"],["dialogue","It's mom."],["cue","JULIAN"],["dialogue","Hi, ma."],["cue","BARBARA"],["dialogue","Tomorrow is Sunday - you've missed three Sunday breakfasts in a row. We're having bagels, lox, eggs and sliced tomato, cucumbers and onions."],["cue","JULIAN"],["dialogue","So ya mean the usual?"],["cue","BARBARA"],["dialogue","Don't get smart . Be here or I'll hunt you down."],["cue","JULIAN"],["dialogue","I'll be there."],["cue","BARBARA"],["dialogue","Goodbye."],["action","Julian dials another."],["cue","JULIAN"],["dialogue","She used to live in Westbury, New York..."],["action","Click. Another number."],["cue","JULIAN (V.O.)"],["dialogue","Ever since I saw my dad's tell at the warehouse, I couldn't stop thinking about the fire."],["action","FLASH: Sirens/Smoke/Red Gum Balls/Andrew with basketball/His parents going silent/"],["cue","JULIAN (V.O.)"],["dialogue","Over the years I'd overhear bits and pieces. Conversations that stopped when I entered the room. Everyone seemed to know something I didn't."],["action","Flashbacks; More crossed-out numbers. A busy signal. A disconnected recording."],["cue","JULIAN (V.O.)"],["dialogue","And Andrew never really left me. Sometimes it was a dream. Sometimes it was a memory. Sometimes it was just that question you never stop asking yourself. Why him? Why not me? Everyone told me something different, and I just couldn't put the pieces together to make sense of it."],["cue","JULIAN"],["dialogue","What is it again?"],["paren","(jotting it down)"],["dialogue","Thank you."],["action","Julian hangs the number on his fridge with a magnet."],["cue","JULIAN (V.O.)"],["dialogue","Jennifer had known us before the fire...and she was there after. If anyone could help me make sense of what happened, it was her. Jennifer wasn't there when the fire started. But she saw what it left behind. And for some reason I couldn't shake the feeling she might tell me what nobody else would."],["action","He picks up his drink, downs it, and considers the number before turning and walking out of the kitchen."]]},{"id":"70","page":"77","pages":"77–78","slug":"INT. GUCCI STOCK ROOM - MORNING","ie":"INT","loc":"GUCCI STOCK ROOM","time":"MORNING","omitted":false,"summary":"Mauro warns Julian that people notice something's off: he needs the guy he hired, present at work. Mauro says he was once like him; Julian thanks him.","old":false,"lead":"","who":["Mauro","Julian"],"el":[["action","The door opens, and it's Mauro. Julian is unpacking shoes and Mauro approaches. Julian looks up, wondering...."],["cue","MAURO"],["dialogue","Listen, you know I love you. You're the Gucci shoe whisperer. But something's off. What's going on?"],["cue","JULIAN"],["dialogue","Nothing, Mauro, I'm good."],["cue","MAURO"],["dialogue","You're not good and people are noticing. What you do after hours is your business, but I need you to be present when you are here at work. I need you to be the guy I hired so if you need extra sleep get it. If you have too much drama in your life cut it out."],["cue","JULIAN"],["dialogue","Understood."],["cue","MAURO"],["dialogue","Good. You're talented, Jules. I was once you. Better dressed, but very similar."],["action","Ice breaker - Julian smiles"],["cue","MAURO  (CONT’D)"],["dialogue","Don't fuck it up, pretty."],["action","Mauro pulls a bottle of cologne from his pocket, sprays it into the air, and then walks through it."],["cue","MAURO  (CONT’D)"],["dialogue","It's a whole new start!"],["action","He turns back to Julian."],["cue","JULIAN"],["dialogue","Mauro?"],["action","Mauro turns back."],["cue","JULIAN  (CONT’D)"],["dialogue","Thank you."],["action","Mauro nods and vamps off..."]]},{"id":"A71","page":"78","pages":"78","slug":"EXT. CAMPUS BUILDING - DAY","ie":"EXT","loc":"CAMPUS BUILDING","time":"DAY","omitted":false,"summary":"Establishing shot of a campus building.","old":false,"lead":"","who":[],"el":[["action","Establishing."]]},{"id":"B71","page":"79","pages":"79","slug":"INT. COUNSELOR'S OFFICE - DAY","ie":"INT","loc":"COUNSELOR'S OFFICE","time":"DAY","omitted":false,"summary":"A school counselor asks Julian about losing Andrew and his bad dreams; at the mention of his father, Julian walks out early. Waiting outside, Candace sees him go, hurt.","old":false,"lead":"","who":["School Counselor","Julian"],"el":[["action","Julian sits in a comfortable chair across from a SCHOOL COUNSELOR."],["cue","SCHOOL COUNSELOR"],["dialogue","Even though it was years ago, the tragic loss of a family member can stay with you forever."],["cue","JULIAN"],["dialogue","I'm fine."],["cue","SCHOOL COUNSELOR"],["dialogue","But the trouble sleeping and the dreams you mentioned -"],["cue","JULIAN"],["dialogue","I'm just a little overwhelmed right now with school."],["cue","SCHOOL COUNSELOR"],["dialogue","You mentioned celebrating Andrew's birthday."],["cue","JULIAN"],["dialogue","Yeah. We eat dinner, my mom makes a cake but we can't light it!"],["cue","SCHOOL COUNSELOR"],["dialogue","And when you asked your father about that?"],["action","Julian stiffens, seeing the dots getting connected and that's enough to disconnect him entirely from the process."],["cue","JULIAN"],["dialogue","Ya know what? I'm done."],["cue","SCHOOL COUNSELOR"],["dialogue","We still have twenty more minutes."],["cue","JULIAN"],["dialogue","Thanks, Doc..."],["action","Julian storms out and turns the opposite way from where Candace is sitting who notices his departure, checks her watch and is hurt and disappointed."]]},{"id":"C71","page":"79","pages":"79","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"71","page":"80","pages":"80","slug":"EXT. FOREST - NIGHT","ie":"EXT","loc":"FOREST","time":"NIGHT","omitted":false,"summary":"The forest nightmare returns, with Mauro, Spoon and Candace's voices and flashes of the fire. The running boy stops at a cliff-edge fork and turns: it's Julian, not Andrew.","old":false,"lead":"","who":["Mauro","Spoon","Candace","Barbara"],"el":[["action","Steadicam POV running through a thick forest at night, moonlight illuminating a path. Breathing is heard."],["cue","MAURO"],["dialogue","You're not fine and everyone is noticing."],["action","Heartbeat is heard - thump thump. Branches scraping, smoke. A small figure way ahead moving...."],["cue","SPOON"],["dialogue","You look like shit..."],["action","The moving POV gets closer to the small boy - it appears to be the same boy from the back as the boy from the LSD trip. Suddenly the figure becomes obscured by smoke and vanishes from sight."],["cue","CANDACE"],["paren","(whispered)"],["dialogue","Stop running!"],["action","FLASH: Candace's hand slipping from Julian's. Flash: the basketball rolling across the driveway back in NY; Flash: Emergency gum ball lights along with a distant siren;"],["cue","BARBARA"],["dialogue","It's okay, sweetheart."],["action","Flash: back to the forest path Andrew's laugh is heard - the small figure reappears from the smoke that dissipates. The boy comes to the same fork in the road at the edge of a cliff and he has to stop at the fork to prevent tumbling over. The boy looks to the left path then to the right path. Then slowly back over his right shoulder to consider returning back down the path from which he's been running. As we see the boys face, it's not Andrew, but JULIAN!!!!!"],["trans","SMASH CUT TO:"]]},{"id":"72","page":"80","pages":"80","slug":"INT. JULIAN'S APARTMENT BEDROOM - NIGHT","ie":"INT","loc":"JULIAN'S APARTMENT BEDROOM","time":"NIGHT","omitted":false,"summary":"Julian sits up in bed gasping, in a cold sweat, woken by the dream.","old":false,"lead":"","who":[],"el":[["action","In a cold sweat Julian sits up in bed gasping, breathing hard awakened from the dark dream."]]},{"id":"73","page":"80","pages":"80–81","slug":"INT. JULIAN'S APARTMENT - CONTINUOUS","ie":"INT","loc":"JULIAN'S APARTMENT","time":"CONTINUOUS","omitted":false,"summary":"Shaken, Julian downs shot after shot of tequila and dials number after number with no answer. Jennifer's hard-won number now seems worthless.","old":false,"lead":"","who":[],"el":[["action","Julian downs a shot of tequila, still visibly shaken. Julian refills the glass. Picks up the phone and dials. It rings no answer."],["action","He pours another shot of tequila, still sweating and downs it. He looks at the list two numbers left. Gets a busy signal . Takes another shot. Julian downs the second tequila and notices Jennifer's number sitting in front of him. The number he fought to get. The number he pinned to the fridge. The number that represented answers. Worthless now. Julian dials another number frantically. It rings and rings and rings....Julian hangs up. Pours another drink and sips...."]]},{"id":"74","page":"81","pages":"81–83","slug":"EXT. CANDACE'S APARTMENT - LATER","ie":"EXT","loc":"CANDACE'S APARTMENT","time":"LATER","omitted":false,"summary":"Drunk, Julian turns up at Candace's window. Hurt that he walked out on the counselor, she ends it, saying she doesn't know him, and takes his car keys.","old":false,"lead":"","who":["Julian","Candace"],"el":[["action","A noticeably drunk Julian stumbles from his car to just below Candace's open window."],["cue","JULIAN"],["paren","(loud whisper)"],["dialogue","Candace! Candace!!!!"],["action","A light turns on and a groggy Candace appears at the window."],["cue","CANDACE"],["dialogue","Julian?"],["cue","JULIAN"],["dialogue","Yeah..."],["cue","CANDACE"],["dialogue","What are you doing here?"],["action","Julian hangs onto the rail of Candace's stoop, unable to tell her what's wrong. Candace disappears from the window and a beat later the door opens to see a wobbly Julian. She reaches out for him, obviously concerned."],["cue","CANDACE   (CONT’D)"],["dialogue","What's going on now? You don't look like you."],["cue","JULIAN"],["dialogue","What does \"me\" look like?"],["action","In that moment something snaps in Candace. It's almost audible. CU of the look on her face. Julian sees it clearly. There is pain in the air, and his eyes are wet."],["cue","CANDACE"],["paren","(irritated)"],["dialogue","I don't know Julian. Just not like this..."],["action","He tries to pretend it all just didn't explode."],["cue","JULIAN"],["dialogue","I'm cool."],["cue","CANDACE"],["dialogue","Cool?"],["cue","JULIAN"],["dialogue","Yeah. I'm just tired. I'm figuring it out, though."],["cue","CANDACE"],["dialogue","For a minute there after dinner, I thought we were finally getting somewhere...Nothing has changed. I was outside that counselor's office, Julian. I was waiting for you. I thought we'd go have lunch when you were finished. I was proud of you for going."],["cue","JULIAN"],["dialogue","Candace— the guy was an idiot."],["cue","CANDACE"],["dialogue","You didn't even give it a try."],["cue","JULIAN"],["dialogue","Just give me some time, baby."],["cue","CANDACE"],["paren","(laughing)"],["dialogue","That's what I've been doing. For too long."],["action","Candace can see she struck a chord, but stands firm. Julian is silent. Painful pause."],["cue","CANDACE  (CONT’D)"],["dialogue","I don't know you, Julian, and I can't do it anymore. (teary) I just can't. I know who I am, I know what I want-and it's not this."],["cue","JULIAN (V.O.)"],["dialogue","In that moment, I knew I had lost her and that she deserved better... and that I never really had her to lose in the first place..."],["cue","JULIAN"],["dialogue","Candace. I love you."],["cue","CANDACE"],["dialogue","I love you too...but not this."],["action","They have a moment and takes his keys."],["cue","CANDACE   (CONT’D)"],["dialogue","And you're not driving drunk."],["action","She turns and walks into her apartment."],["cue","JULIAN"],["paren","(YELLING)"],["dialogue","Candace! Damn it."],["action","Julian kicks the side of the stoop and starts to walk."],["cue","JULIAN (V.O.)"],["dialogue","I really did love her. Candace was ready to build a future. I was still chasing answers from the past."]]},{"id":"75","page":"83","pages":"83","slug":"EXT. LOS ANGELES - DAWN","ie":"EXT","loc":"LOS ANGELES","time":"DAWN","omitted":false,"summary":"Los Angeles wakes up at dawn as Julian drives through a canyon. In voice-over, he says nobody tells you what to do the morning after heartbreak.","old":false,"lead":"","who":["Julian"],"el":[["action","The city waking up. Traffic, a baker loads fresh bagels into a display case. Deli sign."],["cue","JULIAN (V.O.)"],["dialogue","The funny thing about heartbreak is nobody tells you what to do the next morning."],["action","Julian driving through a canyon, passes Casa de Cadillac."]]},{"id":"76","page":"83","pages":"83","slug":"EXT. ENCINO WEISS HOME - DAY","ie":"EXT","loc":"ENCINO WEISS HOME","time":"DAY","omitted":false,"summary":"Julian pulls up at the family home in the Alfa, looking emotionally drained.","old":false,"lead":"","who":[],"el":[["action","Julian pulls up in the Alfa looking emotionally drained."]]},{"id":"77","page":"83","pages":"83–85","slug":"INT. ENCINO WEISS HOME - DAY","ie":"INT","loc":"ENCINO WEISS HOME","time":"DAY","omitted":false,"summary":"Julian finds Lenny and Barbara watching Aunt Rita's 8mm film of Andrew's third birthday. He tells them Candace left him, and the three hold hands as Andrew blows out candles.","old":false,"lead":"","who":["Julian","Barbara","Lenny"],"el":[["action","CU of a home movie screen. A Bell & Howell 8mm project plays desaturated Kodachrome movie of Andrew's 3rd birthday party. Lenny and Barbara are seen on either side of the couch. Julian freezes as he catches the images from years past."],["cue","JULIAN"],["dialogue","Wow, it's good to see him moving and not just in a photo."],["action","Lenny pauses the projector as Barbara turns, teary."],["cue","BARBARA"],["dialogue","I know, right?"],["cue","LENNY"],["dialogue","You look terrible."],["action","Needing comfort, he slides in between mom and dad."],["cue","JULIAN"],["dialogue","I feel terrible."],["cue","BARBARA"],["dialogue","What's wrong honey?"],["cue","JULIAN"],["dialogue","Candace and I broke up."],["action","Barbara puts her arm around him."],["cue","BARBARA"],["dialogue","Oh my. I'm so sorry."],["cue","JULIAN"],["dialogue","Technically, she broke up with me."],["action","Lenny puts his arm around him."],["cue","LENNY"],["dialogue","That's tough. I'm sorry. It'll hurt for a while."],["cue","BARBARA"],["dialogue","What happened? I thought everything was going so well between you two? Do you wanna talk about it?"],["cue","LENNY"],["dialogue","Barbara - slow down..."],["cue","JULIAN"],["dialogue","It's okay, pop. Ma - how about we go to DuPars for lunch tomorrow and I'll tell you all about it."],["action","Barbara kisses his head."],["cue","BARBARA"],["dialogue","I'd like that."],["cue","JULIAN"],["dialogue","Can you keep playing the film, pop? It's really nice to see. Where did you get this? I thought we lost everything?"],["cue","LENNY"],["dialogue","Aunt Rita found it. She shot it at Andrew's party."],["action","Lenny hits play and the three of them soak in the memories. Andrew at the table on Lenny's lap as Barbara and Joanie bring in the cake with lit candles. Julian sits on one side and Fred on the other. Everyone is smiling. Andrew blows out the candles and accidentally dips his face into the frosting. Barbara Lenny and Julian all laugh. Jennifer appears with a rag and wipes Andrew's face as the connected trio clasp hands as they watch the happier times before the tragedy."],["cue","JULIAN (V.O.)"],["dialogue","Maybe that's why I came home. Not for answers. Not because I'd missed the last three Sundays. I think I just needed my family."]]},{"id":"78","page":"85","pages":"85","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"79","page":"85","pages":"85–87","slug":"INT. GUCCI STORE - NIGHT","ie":"INT","loc":"GUCCI STORE","time":"NIGHT","omitted":false,"summary":"Mauro unveils a navy blue wedding dress to Victoria, Sophia, Spoon and Julian. Struck by their reaction, Julian wonders what his own passion is; a candle triggers an ironing flashback.","old":false,"lead":"","who":["Victoria","Sophia","Julian","Spoon","The Group","Mauro","Lenny"],"el":[["action","The whole gang celebrating. They all have cocktails and blindfolds hanging from them in some way, but not on."],["cue","VICTORIA"],["paren","(a tad tipsy)"],["dialogue","Cheers to the beginning of a new season of Gucci! May this one make us insanely rich and filled with...purpose! Yes, that's it. Something we all need. Anyone else?"],["action","They all raise their shot glasses."],["cue","SOPHIA"],["dialogue","This one is for you, Aldo. The icon of Gucci..."],["action","Julian raises a finger as he looks up to the sky. Everyone is eager to drink when Julian adds one last thought..."],["cue","JULIAN"],["dialogue","Without you, we wouldn't be here..."],["action","Spoon notices a heaviness that no one else does."],["cue","SPOON"],["dialogue","I’m parched as fuck - can we drink?"],["cue","THE GROUP"],["dialogue","Wooooohooooo!"],["cue","MAURO"],["dialogue","Okay this is Gucci tradition. The new lineup is here. I have never been more passionate about a new collection before. It's fresh, revived, reinvented, and sincere. This is the fall I want to live for. Put on your blindfolds people!"],["cue","VICTORIA"],["dialogue","Before we do - Cheers to the beginning of a new season of Gucci! Amazing things lay ahead for us all!"],["cue","SOPHIA"],["dialogue","From your mouth to God’s ears."],["cue","MAURO"],["dialogue","Now blindfolds people!"],["action","They all fumble and LAUGH while putting them on. Mauro turns out the lights to expose the abundance of lit candles in the room. The gang waits with bated breath. There is RUSTLING..."],["cue","MAURO  (CONT’D)"],["dialogue","Now, this piece is so remarkable it honestly makes me happy to be alive. OK all you beautiful babes, please remove your blindfolds!"],["cue","SOPHIA"],["dialogue","Finally!"],["action","The lot takes off their blindfolds. Everyone standing in a horizontal line like in Ocean's Eleven with their arms touching. CUs of each character's face in slow motion as they look at the piece Mauro unveils that we don't yet see."],["cue","JULIAN (V.O.)"],["dialogue","I was in actual shock."],["action","Sophia puts her hand over her mouth with wide eyes as Victoria touches her heart. Spoon raises his hands to the sky in a hallelujah fashion and mouths \"FUCK YEAH\" slowly, seeing his far-off future."],["cue","JULIAN (V.O.)"],["dialogue","Seeing something cause that level of reaction from my peers was moving. I mean Mauro was on cloud nine."],["action","Julian notices his colleagues emotional reaction to a dress. Reveal: Mauro twirls around proudly the most mesmerizing wedding dress made of navy blue satin and lace. There has never been anything like it at Gucci or anywhere. The entire group APPLAUDS...everyone but Julian who has a moment."],["cue","JULIAN (V.O.)"],["dialogue","The dress truly was beyond impressive, but I was struck more by everyone's reaction to it, rather than the dress itself. I realized whatever I was chasing had to bring me that same levepassion. For Mauro and most of the crew it was Gucci. Spoon had comedy. For the first time I really wondered what mine was."],["action","Julian's gaze attaches to the flame of a candle. Flashback - an iron gliding across a shirt HSSSS steam erupts. Flash - Lenny snaps the shirt of the board."],["cue","LENNY (O.S.)"],["dialogue","Time for bed."],["action","Back on Julian. His stare lingers a beat too long. Spoon comes up and grabs his arm whispering..."],["cue","SPOON"],["dialogue","Now I ain’t about to tear up about some new dress, Gucci Boy - but this is exactly how I feel when I get home after killing it on stage."],["action","Julian nods understanding as he stares off. A lightbulb."]]},{"id":"80","page":"87","pages":"87","slug":"INT. JULIAN'S APARTMENT - NIGHT","ie":"INT","loc":"JULIAN'S APARTMENT","time":"NIGHT","omitted":false,"summary":"Every Jennifer Smith on Julian's list is crossed out but one, and he dials it.","old":false,"lead":"","who":[],"el":[["action","Julian pulls out his Jennifer Smith list and they are all scratched out except one. He dials."]]},{"id":"81","page":"87","pages":"87–89","slug":"INT. JENNIFER SMITH'S HOUSE - SIMULTANEOUSLY","ie":"INT","loc":"JENNIFER SMITH'S HOUSE","time":"SIMULTANEOUSLY","omitted":false,"summary":"Julian finally reaches Jennifer, back in New York after caring for her mother, and she invites him over. Flashback: young Julian pours milk downstairs as Lenny orders him to bed.","old":false,"lead":"","who":["Jennifer","Julian","Lenny"],"el":[["action","Jennifer Smith answers."],["dialogue","JENNIFER"],["action","Hello?"],["dialogue","JULIAN"],["action","Yeah, hi - I'm looking for a Jennifer Smith. It’s Julian."],["dialogue","JENNIFER"],["action","Roo?"],["dialogue","JULIAN"],["action","Jenny?!!!!"],["dialogue","JENNIFER"],["action","How are you? Oh my God! How is the family?"],["dialogue","JULIAN"],["action","They're fine...I've been searching for you for a long time."],["dialogue","JENNIFER"],["action","I was in Florida taking care of my mom for the last three years. She just passed, so I'm back in New York."],["dialogue","JULIAN"],["action","I'm so sorry about your mom..."],["dialogue","JENNIFER"],["action","That's okay, she was 96! She had a very good life. It's so good to hear your voice. You must be nineteen now?"],["dialogue","JULIAN"],["action","Twenty."],["dialogue","JENNIFER"],["action","I can't stand it! Are you in college?"],["dialogue","JULIAN"],["action","Yeah, UCLA. I'd love to see you and catch up. I may be in New York soon."],["dialogue","JENNIFER"],["action","I'll be here. I'd love to see you!"],["dialogue","JULIAN"],["action","Are you sure? I don't want to inconvenience you or..."],["cue","JENNIFER"],["dialogue","Are you kidding me? It's so good to hear your voice! I can’t wait to see you. Call me back when you know your date and I’ll see you soon!"],["action","Julian nods and accepts her invitation."],["cue","JULIAN"],["dialogue","Okay. Thanks, Jenny..."],["cue","JULIAN (V.O.)"],["dialogue","I thought that I was either the luckiest guy in the world or forever damned...and it was only a matter of time before I was going to find out...I was going to know the truth, once and for all."],["action","Flash: A refrigerator opens up and young Julian pulls out a glass bottle of milk and pours a glass. As he sips he hears:"],["cue","LENNY (O.S.)"],["dialogue","Julian? Are you still down there? I said go to bed!"],["action","Julian panics."],["cue","JULIAN"],["dialogue","I am, dad...coming up now. Was just getting some milk."],["cue","LENNY"],["dialogue","Now!"],["action","Julian downs the milk, wipes his mouth and turns off the lights."]]},{"id":"82","page":"89","pages":"89–92","slug":"INT. ENCINO WEISS HOME - NIGHT","ie":"INT","loc":"ENCINO WEISS HOME","time":"NIGHT","omitted":false,"summary":"At a family deli dinner with Aunt Rita and Uncle Morty, Julian refuses to take over Lenny's business; he's applied for New York finance internships. Lenny thinks he'll come around.","old":false,"lead":"","who":["Aunt Rita","Barbara","Julian","Lenny","Uncle Morty","Joanie","Fred"],"el":[["action","Julian, Barbara, Lenny, Joanie, and Fred sit around the table with AUNT RITA and UNCLE MORTY in attendance passing a big spread around - deli."],["cue","AUNT RITA"],["dialogue","Eat up, kids. You're all way too skinny. My sister moves to California and they starve ya to death?"],["action","She shakes her head."],["cue","BARBARA"],["dialogue","It's just a different way of life, Barb. They live outside. I never see them, except for dinner."],["cue","JULIAN"],["paren","(looking to Lenny)"],["dialogue","Dad, I don't want to take over the family business."],["action","The entire room goes silent."],["cue","LENNY"],["dialogue","Let's talk about this later."],["cue","JULIAN"],["dialogue","I'll still have the same thoughts about it later. I'm...sorry, dad. Maybe now wasn't the right time but I can't hold it in any longer. I just want a different life."],["action","Aunt Rita rolls her eyes at Barbara."],["cue","AUNT RITA"],["dialogue","What did I tell you about L.A., Barbara?"],["cue","UNCLE MORTY"],["dialogue","Stay out of it, Rita..."],["cue","BARBARA"],["dialogue","Julian. You can't just throw away what your father has built."],["cue","JULIAN"],["dialogue","That's exactly the point. I didn't build anything. He did. I need to build something for myself. Something I can look back on and know I did it...that I did it all."],["cue","JOANIE"],["dialogue","I can take it over, Dad!"],["cue","FRED"],["dialogue","Well, I can't either. I have other plans."],["cue","BARBARA"],["dialogue","Enough, you two."],["cue","JOANIE"],["dialogue","But I'm serious, Mom."],["cue","BARBARA"],["dialogue","Joanie!"],["cue","LENNY"],["dialogue","No, no. It's okay, Barbara. He's right. He needs to find his own way."],["action","Barbara turns to Lenny in disbelief at his response and then to Julian."],["cue","BARBARA"],["dialogue","And what do you plan on doing?"],["cue","JULIAN"],["dialogue","...I'm not sure yet."],["cue","BARBARA"],["paren","(throwing her hands up)"],["dialogue","He's not sure."],["cue","JULIAN"],["dialogue","But I did apply for three internships through UCLA. They're in New York."],["cue","BARBARA"],["dialogue","New York? What kind of internships?"],["cue","JULIAN"],["dialogue","Finance."],["action","Barbara taken aback. Lenny raises an eyebrow."],["cue","JULIAN  (CONT’D)"],["dialogue","I just know that I'll never find what my blue silk laced wedding dress is running the family business."],["cue","BARBARA"],["paren","(stunned)"],["dialogue","Wedding dress? Blue what? Is Candace pregnant?"],["cue","JULIAN"],["dialogue","What, ma? No!"],["cue","JOANIE"],["paren","(disappointed)"],["dialogue","Of course she's not."],["cue","AUNT RITA"],["paren","(to Morty)"],["dialogue","California - I told you...."],["cue","UNCLE MORTY"],["dialogue","Pass the pastrami."],["cue","LENNY"],["dialogue","He'll come around, Barb.."],["cue","JULIAN"],["dialogue","I won't."],["action","Lenny and Barbara ignore him."],["cue","JULIAN (V.O.)"],["dialogue","I still don't know if he was in denial or really thought I would come around..."],["action","Julian and Lenny lock eyes, and it's clear they have two very different truths."]]},{"id":"83","page":"92","pages":"92–93","slug":"INT. GUCCI STORE - DAY","ie":"INT","loc":"GUCCI STORE","time":"DAY","omitted":false,"summary":"Julian says goodbye at Gucci. Sophia, Victoria and Mauro send him off with praise and advice, and for once he stands by the double-G's without adjusting himself.","old":false,"lead":"","who":["Sophia","Victoria","Julian","Mauro"],"el":[["action","The store hums. A calm Julian is with the team. The air feels different, and they all know it."],["cue","SOPHIA"],["paren","(honest)"],["dialogue","You were good. Don’t lose that."],["action","Julian feels the internal pat on his back. Julian nods and accepts the challenge."],["cue","VICTORIA"],["dialogue","One of a kind. It's a shame to see you go so soon. We just got you housebroken. So are you leaving us Gucci Julian or non-Gucci Julian?"],["cue","JULIAN"],["dialogue","I think I'm down to the non-Gucci Julian now. I just have to zero in on who he really is."],["cue","VICTORIA"],["dialogue","Sounds like progress."],["cue","JULIAN"],["dialogue","Thanks, Victoria."],["action","Mauro steps forward like a big brother."],["cue","MAURO"],["dialogue","You have instincts that cannot be taught. But like looks, instincts without discipline fade. You think I have these receipts and this ass without work."],["action","They all LAUGH."],["cue","MAURO  (CONT’D)"],["dialogue","Learn the difference."],["action","Julian looks around at the mirrors, the version of himself he was playing there."],["cue","JULIAN"],["dialogue","Please and thank you...truly."],["action","Customers demand attention the group breaks off. Gucci waits for no one. Julian walks to the infamous double-G's and for the first time he doesn't adjust himself. He. Just. Is."]]},{"id":"84","page":"93","pages":"93","slug":"EXT. ENCINO WEISS HOME - DAY","ie":"EXT","loc":"ENCINO WEISS HOME","time":"DAY","omitted":false,"summary":"Julian's Alfa sits in the driveway as he heads into the house.","old":false,"lead":"","who":[],"el":[["action","The Alfa in the driveway. Julian on his way into the house."]]},{"id":"85","page":"93","pages":"93–94","slug":"INT. ENCINO WEISS HOME - DAY","ie":"INT","loc":"ENCINO WEISS HOME","time":"DAY","omitted":false,"summary":"Julian gets a Morgan Stanley interview, and Lenny is thrilled. He and Barbara will pay the ticket; Julian can bunk with Lenny, in New York for a trade show.","old":false,"lead":"","who":["Lenny","Julian"],"el":[["action","Julian enters. Barbara is doing the dishes as Lenny reads the paper (no ID on paper) and drinks coffee. Julian kisses him mom and sets a letter on the table by his dad."],["cue","LENNY"],["dialogue","What's this?"],["cue","JULIAN"],["dialogue","Letter from Morgan Stanley. I got the interview."],["cue","LENNY"],["dialogue","Morgan Stanley? How?"],["cue","JULIAN"],["dialogue","Based on my GPA and early graduation. Open it."],["cue","LENNY"],["paren","(reading)"],["dialogue","We are proud to invite you to an in person interview to be part of our exclusive Internship Team."],["action","Barbara turns."],["cue","LENNY  (CONT’D)"],["dialogue","That's fantastic!"],["cue","JULIAN"],["dialogue","Yeah! But Goldman Sachs and Meryl Lynch passed..."],["cue","LENNY"],["dialogue","Who cares, this could be huge!"],["action","Julian is lifted by his father’s optimism and pride as Lenny looks at the letter."],["cue","LENNY  (CONT’D)"],["dialogue","Wait, this is next Thursday."],["cue","JULIAN"],["dialogue","Yeah, I wanted to know if I can get a loan for the trip."],["cue","LENNY"],["dialogue","I'll be in New York this Saturday to Saturday for the Fashion Trade show. Mom and I will cover your ticket but to save hotel money you bunk with me."],["cue","JULIAN"],["dialogue","Really?"],["action","Barbara comes over and puts her arm around Julian."],["cue","LENNY"],["dialogue","Really..."],["cue","JULIAN"],["dialogue","Thanks guys..."]]},{"id":"86","page":"94","pages":"94–97","slug":"INT. POKER SCENE - NIGHT","ie":"INT","loc":"POKER SCENE","time":"NIGHT","omitted":false,"summary":"Julian beats Spoon and Adam at poker and tells them part of the truth: he's done with Lenny's business, Candace and Gucci. His friends say they've got his back.","old":false,"lead":"","who":["Julian","Spoon","Adam"],"el":[["action","Julian, Spoon and Adam and a N/D player (who is all in and is poised to win) sit around a poker table. There is one empty chair from a player who has been busted and is gone. Cigars, drinks, colorful chips and a dangling overhead light. Large round table with black tablecloth and a smaller green felt top. All cards are down except for Julian who lays down his hand. Adam is looking really low on chips and Spoon is right behind him."],["cue","JULIAN"],["dialogue","Full house. Kings full of tens."],["action","The N/D player
