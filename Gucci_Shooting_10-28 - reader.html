 leaves. Julian grabs the cards and begins shuffling."],["cue","SPOON"],["dialogue","So New York huh?"],["cue","JULIAN"],["dialogue","We’ll see what happens. Ya never know."],["cue","ADAM"],["dialogue","Could be a brand new start."],["cue","JULIAN"],["dialogue","Yes! Hey, Spoon I have a tip to help your poker game."],["cue","SPOON"],["paren","(looks to Adam))"],["dialogue","I know this is a setup...but I’ll bite. What’s the tip?"],["cue","JULIAN"],["dialogue","Stick to comedy."],["action","Julian offers the cut."],["cue","SPOON"],["dialogue","Ain’t that a bitch?"],["action","Julian deals the next hand"],["cue","JULIAN (V.O.)"],["dialogue","I told them parts of the truth... that I was done with Lenny's business, Candace and I broke up and also that I left Gucci."],["cue","ADAM"],["dialogue","Gimme one."],["cue","SPOON"],["dialogue","I’ll take three."],["cue","JULIAN"],["dialogue","Dealer takes two. Since you’re both low on chips let me put you out of your misery now. I’m hungry and the winner is treated right?"],["action","The two impatiently nod."],["cue","JULIAN  (CONT’D)"],["dialogue","Okay - and I'm choosing Hamburger Hamlet. Sautéed Mushroom Burger."],["cue","ADAM"],["dialogue","Two bucks."],["cue","SPOON"],["dialogue","I’ll call."],["action","Julian eyes the chips of his opponents."],["cue","JULIAN"],["dialogue","I’ll see your two and raise you five."],["action","Adam and Spoon look at each other. Julian smiles."],["cue","SPOON"],["dialogue","Gucci BOy is bluffing."],["cue","JULIAN"],["dialogue","Maybe. Tell ya what - I’ll show ya a card."],["cue","ADAM"],["dialogue","What?"],["cue","JULIAN"],["dialogue","Yeah, you guys are out - so pick a card...."],["action","Silence."],["cue","JULIAN  (CONT’D)"],["dialogue","Guys I’m trying to help."],["cue","SPOON"],["dialogue","Okay, that one on the end."],["action","Julian turns over an 8 of hearts. Adam looks at Julian and back at his cards."],["cue","ADAM"],["dialogue","All in."],["cue","SPOON"],["dialogue","You know I’m in."],["cue","JULIAN (V.O.)"],["dialogue","At the end of the day, leaving Gucci was inevitable. Candace was right. I couldn't be a shoe salesman fo(MORE)(MORE)rever. That was really"],["dialogue","no different from selling knockoffs for my dad, just a little pricier."],["cue","SPOON"],["dialogue","Clock's ticking big talker."],["action","Julian reveals a straight. Beats them both."],["cue","ADAM"],["paren","(to Spoon)"],["dialogue","We're done."],["cue","JULIAN"],["dialogue","Beside my dad and Gucci - now that I spanked your asses, I'm free... To do whatever the hell I want!"],["action","The boys like this sentiment. It peps Julian up a bit."],["cue","SPOON"],["dialogue","This fool...Listen, we're both glad you finally found your path."],["cue","ADAM"],["dialogue","Or at least the path you're aren’t taking."],["action","Julian points at Adam like \"exactly.\""],["cue","SPOON"],["dialogue","We got your back, bro."],["cue","JULIAN"],["dialogue","Thanks, guys... I just have one question."],["cue","SPOON"],["dialogue","Wassup?"],["cue","JULIAN"],["dialogue","This is serious. Since you guys are buying, should I get the Apple Pie or the Hot fudge cake?"],["cue","SPOON"],["dialogue","Man, fuck you."],["cue","JULIAN"],["paren","(huge grin)"],["dialogue","Fuck you too, man. I’m ordering both..."]]},{"id":"A87","page":"98","pages":"98","slug":"INT. JULIAN'S APARTMENT - DAY","ie":"INT","loc":"JULIAN'S APARTMENT","time":"DAY","omitted":false,"summary":"Julian finishes a journal entry, packs it in his carry-on and takes a last look around his apartment before leaving.","old":false,"lead":"","who":[],"el":[["action","On the table sits a small carry on suitcase packed but open. Julian sits at the desk finishing a journal entry. He closes the journal, puts the journal in and zips it up. Moving to the door, he looks around one last time at the apartment knowing his future lays ahead."]]},{"id":"87","page":"98","pages":"98","slug":"EXT. JFK AIRPORT - DAY","ie":"EXT","loc":"JFK AIRPORT","time":"DAY","omitted":false,"summary":"A TWA jet lands at JFK.","old":false,"lead":"","who":[],"el":[["action","TWA jet landing."]]},{"id":"88","page":"98","pages":"98","slug":"EXT. NYC -DAY","ie":"EXT","loc":"NYC","time":"DAY","omitted":false,"summary":"Establishing shot of a five-storey tenement walk-up near the E train's 50th Street station.","old":false,"lead":"","who":[],"el":[["action","Establishing of a five story tenement walk up as we see the E train near the 50th St station"]]},{"id":"89","page":"98","pages":"98–102","slug":"INT. JENNIFER SMITH'S NYC APARTMENT - DAY","ie":"INT","loc":"JENNIFER SMITH'S NYC APARTMENT","time":"DAY","omitted":false,"summary":"Julian's tearful reunion with Jennifer turns to Andrew and the fire. Asked what caused it, she says to ask his father; a flashback shows Lenny sending young Julian to bed.","old":false,"lead":"","who":["Jennifer","Julian","Lenny","Young Julian"],"el":[["action","Julian knocks, a tad nervous. Jennifer opens the door."],["cue","JENNIFER"],["dialogue","Oh my word. Roo. Look at you!"],["action","She opens the door glowing at seeing Julian. Julian feels a rush of comfort from this familiar face."],["cue","JENNIFER   (CONT’D)"],["dialogue","You're a full-grown man, and so handsome. Come in! Put your stuff down."],["action","Julian walks in, and they look at each other intensely. She fights tears. They both reach in at the same time for a hug. It's an embrace and connection we've only seen similar to that of Julian and his parents. The love is thick. Dissolve to : Julian and Jennifer sit across from each other on two couches in her living room. Julian drinks a n/d Chocolate milk as Jennifer sips a N/D Soda."],["cue","JENNIFER   (CONT’D)"],["dialogue","You always did have big dreams, Julian. I always pictured you in Italy or Paris. You and all your little clothes. How you loved them."],["action","Julian gives a reflective and appreciative nod."],["cue","JULIAN"],["dialogue","Italy? Paris? Really?"],["cue","JENNIFER"],["dialogue","Oh, absolutely. So why are you here in New York?"],["cue","JULIAN"],["dialogue","I have an interview with Morgan Stanley."],["cue","JENNIFER"],["dialogue","Oh my God...I can’t believe it."],["cue","JULIAN"],["dialogue","Jenny..."],["cue","JENNIFER"],["dialogue","Yes..."],["cue","JULIAN"],["dialogue","You were almost part of our family and the one thing I never really understood was why my parents just up and moved after the fire."],["cue","JENNIFER"],["dialogue","Well, they were devastated. They probably believed moving would help, ya know?"],["cue","JULIAN"],["dialogue","I guess I get that. \"A fresh start,\" is what my dad kept preaching but it felt like we were running away from something."],["action","Jennifer sits back and takes a deep breath."],["cue","JENNIFER"],["dialogue","They lost everything, Julian. Including Andrew. They were broken. There was no roadmap. People didn’t talk about things back then. They just did the best they could."],["action","Tears start to run down Julian's face. Jennifer leans in as tears run down her cheeks."],["cue","JULIAN"],["dialogue","But my parents seemed to never want to talk about it. They seemed frozen. Every time I tried to talk about it they would say there was nothing to talk about."],["action","Jennifer nods, placing her hand on his as she allows Julian to continue."],["cue","JULIAN  (CONT’D)"],["dialogue","When I would ask questions about what happened that night they'd just cut me off and say \"what's there to know?\""],["cue","JENNIFER"],["dialogue","I’m so sorry. That had to be frustrating."],["cue","JULIAN"],["dialogue","I mean I still dream about it."],["cue","JENNIFER"],["dialogue","That's not surprising."],["cue","JULIAN"],["dialogue","Even after all these years?"],["cue","JENNIFER"],["dialogue","Julian, your little brother died."],["cue","JULIAN"],["dialogue","I miss him, Jennifer."],["cue","JENNIFER"],["dialogue","I know. I miss him too. God he loved you so much. \"When Julian home?\" \"I play with Julian!\" He loved when you showered him with attention."],["action","They both smile allowing a momentary break in the heaviness."],["cue","JULIAN"],["dialogue","But why am I so haunted by this?"],["cue","JENNIFER"],["dialogue","Everybody was haunted by it, Julian. You mom. Your dad, Joanie, Fred....Me. Your father couldn't sleep, your mother couldn't eat. Nobody knew what to say. What do you say?"],["action","Julian looks up at her eyes."],["cue","JULIAN"],["dialogue","There's nothing you can say..."],["cue","JENNIFER"],["dialogue","The hardest part is often when people gets stuck looking backward."],["paren","(beat)"],["dialogue","We're here now, Julian. It’s easy to get stuck. Don't miss it."],["cue","JULIAN"],["dialogue","But for me, something always felt off."],["action","A beat. She waits to see if there is more but there isn't."],["cue","JENNIFER"],["dialogue","What do you mean?"],["cue","JULIAN"],["dialogue","I don't know, like everybody knew something that I didn't."],["cue","JENNIFER"],["dialogue","Your father carried that day around longer than anyone."],["cue","JULIAN"],["dialogue","Do you know what caused the fire?"],["cue","JENNIFER"],["dialogue","I know what I remember...but if you're ready for that conversation it shouldn't be with me. Maybe it's time to have that conversation with your father."],["action","Julian absorbs that. FLASH — YOUNG JULIAN reaches the top of the stairs. Lenny is waiting in the hallway."],["cue","LENNY"],["dialogue","Bedtime means bedtime, kiddo. You've got school tomorrow."],["cue","YOUNG JULIAN"],["dialogue","I know, Dad. Sorry."],["action","Lenny softens, puts a hand on his shoulder and guides him toward the bedroom."],["cue","JENNIFER"],["dialogue","Julian?"],["cue","JULIAN"],["dialogue","...yeah - sorry. I was just thinking. You’re right."],["action","Jennifer is moved by his difficult journey. Julian rises and hugs Jennifer."],["cue","JULIAN  (CONT’D)"],["dialogue","Thanks for seeing me."],["cue","JENNIFER"],["dialogue","Are you kidding, Roo? I’m always here for you. And if you get that job - I expect a meal once a week."],["cue","JULIAN"],["dialogue","It would be my pleasure."],["cue","JENNIFER"],["dialogue","I love you, Roo..."],["cue","JULIAN"],["dialogue","I love you too..."],["action","Julian heads out the door and looks back at Jennifer’s smiling face as he closes the door."]]},{"id":"90","page":"102","pages":"102","slug":"OMITTED","ie":"","loc":"OMITTED","time":"","omitted":true,"summary":"","old":false,"lead":"","who":[],"el":[]},{"id":"91","page":"102","pages":"102–103","slug":"INT. CAR NYC STREETS - CONTINUOUS","ie":"INT","loc":"CAR NYC STREETS","time":"CONTINUOUS","omitted":false,"summary":"Driving through New York, Lenny raves about a laser fabric cutter he ordered and wants to show Julian something. Julian says he got the internship; Lenny wants to celebrate.","old":false,"lead":"","who":["Lenny","Julian"],"el":[["action","CU of Lenny driving shifting his gaze from the road to the passenger seat as he talks excitedly to Julian."],["cue","LENNY"],["dialogue","The show is amazing. I ordered a used computerized laser fabric cutter that can cut 200 shirt patterns in under three minutes!"],["cue","JULIAN"],["dialogue","Expensive?"],["cue","LENNY"],["dialogue","Very, but zero human errors!"],["cue","JULIAN"],["dialogue","Then it'll pay for itself."],["cue","LENNY"],["dialogue","That's what I'm counting on. So ya know where we're going? Borelli's! But I wanna show you something first. Jeez, Borelli's... I haven't had it sinc(MORE)(MORE)e we left."],["dialogue","We'll split a pizza but I'm getting the veal parm - or the linguine and clams...but first I want to show you something. Why are you so quiet? How did the interview go?"],["cue","JULIAN"],["dialogue","Terrific. I got it."],["cue","LENNY"],["dialogue","You got it? Are you kidding me? Why didn’t you tell me? We have to call your mother later. How so fast? I thought you had to wait."],["cue","JULIAN"],["dialogue","The guy said he liked me. Said I was in."],["cue","LENNY"],["dialogue","Well, what's not to like? That's terrific! So we celebrate tonight!"]]},{"id":"92","page":"103","pages":"103","slug":"EXT. LONG ISLAND TURNPIKE - DAY","ie":"EXT","loc":"LONG ISLAND TURNPIKE","time":"DAY","omitted":false,"summary":"Lenny and Julian's car leaves the turnpike at the Westbury Hills sign.","old":false,"lead":"","who":[],"el":[["action","The car gets off the turnpike. Sign says Westbury Hills."]]},{"id":"93","page":"103","pages":"103–109","slug":"EXT. WESTBURY, LONG ISLAND, NEW YORK","ie":"EXT","loc":"WESTBURY, LONG ISLAND, NEW YORK","time":"","omitted":false,"summary":"Lenny shows Julian their old lot, now Andrew Park. Flashbacks reveal Julian ironing the night of the fire; Lenny says it wasn't his fault and accepts his Wall Street choice.","old":false,"lead":"","who":["Julian","Lenny"],"el":[["action","The car makes its way into the suburban neighborhood that was their past."],["cue","JULIAN"],["dialogue","Where are we going?"],["cue","LENNY"],["dialogue","Julian, when we left New York, the insurance paid off the loss and we used the money to buy the California house. But we never sold the lot. Your mother and I couldn't deal with someone rebuilding on what felt like sacred ground. So it sat. All this time."],["cue","JULIAN"],["dialogue","And? We're going to visit an empty lot? Why?"],["action","The car navigates through the neighborhood and pulls up to their old lot that is now a park."],["action","Swing set, benches, teeter totter, etc. A mom sits with a buggy while her other children swing and play on the slide."],["cue","LENNY"],["dialogue","Your mother decided she wanted laughter and good times here so we donated the land to the city with the understanding it had to be used for a community park."],["action","Julian can't believe it. He opens the door and gets out and walks toward the park. Lenny follows. Julian is paused in front of a sign that says \"Andrew Park\" and \"In Memory of Andrew Weiss 1965-1968\" and there is a 3D bronze portrait relief of Andrew with a small saying: \"A child's laugh is like sunshine in the house\" - Mignon McLaughlin. Half of the last name is covered with fresh flowers."],["cue","JULIAN (V.O.)"],["dialogue","I was actually really proud of my mom and dad. I couldn't believe how beautiful it was...A wonderful tribute to Andrew at the last place we were all together as a family... the place where part of me died... Truthfully - a place where part of our entire family died."],["cue","JULIAN"],["dialogue","This is beautiful, pop..."],["action","Lenny takes a deep breath in and out. He puts his arm around his son."],["cue","LENNY"],["dialogue","It's my first time seeing it. They called last month about the dedication."],["cue","LENNY  (CONT’D)"],["dialogue","Your mother and I couldn't do it. We just wanted it to be."],["action","Julian glances at his dad. He’s almost teary."],["cue","JULIAN"],["dialogue","I saw Jennifer Smith today."],["cue","LENNY"],["dialogue","No kidding? I thought she moved to Florida?"],["cue","JULIAN"],["dialogue","She did but her mom died so she moved back."],["cue","LENNY"],["dialogue","How's she doing?"],["cue","JULIAN"],["dialogue","Good. It was good to see her."],["cue","LENNY"],["dialogue","She probably couldn't believe how big you are now, huh?"],["cue","JULIAN"],["dialogue","You're right. She was amazed..."],["action","A beat."],["cue","JULIAN  (CONT’D)"],["dialogue","Hey pop...one of the reasons I tracked her down is cause I always felt like nobody would tell me anything...I guess because we were all in a lot of pain."],["action","WHITE FLASH TO: Flashback: Lenny ironing his shirt the night of the fire with Julian watching."],["cue","LENNY"],["dialogue","Sell to the masses!"],["cue","JULIAN"],["dialogue","Eat with the classes!"],["action","Lenny unplugging the iron and putting it away. WHITE FLASH - back on Lenny at park looking out. Julian gazing at Andrew's image on the plaque."],["cue","LENNY"],["dialogue","We were in a lot of pain... we probably still are...I'm not sure that pain ever goes away."],["action","Silence as the two just observe the kids playing..."],["cue","JULIAN"],["dialogue","Hard to believe...This is the last place we were all together as a family..."],["action","Off Julian's gaze: WHITE FLASH - Julian copying his idol father and ironing his Pierre Cardin shirt, snapping it just the way Lenny did and getting the cuffs, the collar like a pro."],["cue","LENNY (O.S.)"],["dialogue","Julian? Are you still down there? I said go to bed!"],["action","Julian panics, leaving the iron face down on the shirt and running toward the kitchen and stairwell."],["cue","JULIAN"],["dialogue","I am, dad...coming up now. Was just getting some milk."],["cue","LENNY"],["dialogue","Now!"],["action","Julian turns off the lights downstairs and goes up. Hugs his dad and gets in bed, Fred sleeping next to him in his twin. CU of the iron on the shirt getting hot. WHITE FLASH - back on Julian's gaze. In pain as memories are flooding in richer now than ever before."],["cue","JULIAN"],["dialogue","Pop -"],["cue","LENNY"],["dialogue","Yeah..."],["cue","JULIAN"],["dialogue","I wasn't getting milk that night."],["cue","LENNY"],["dialogue","What?"],["cue","JULIAN"],["dialogue","When you yelled at me for being downstairs and I said I was getting a glass of milk."],["cue","JULIAN  (CONT’D)"],["dialogue","I was actually ironing my shirt. Just like you... and when you yelled at me I got scared and ran upstairs..."],["action","Lenny is tearing up. His son figured it out...or is trying."],["cue","JULIAN  (CONT’D)"],["dialogue","For years I've been trying to remember if I unplugged the iron. But I could never remember..."],["cue","LENNY"],["dialogue","Julian, it's okay..."],["action","Off Lenny's teary eyes gazing at his pained son we CUT TO A WHITE FLASH: flashback from the opening of the Fire Marshall calling Lenny over while the family in blankets among fire trucks and Jennifer and neighbors observe. This time we see the FM showing Lenny the iron. Lenny is horrified. The FM turns the iron over displaying the face where we see a PIERRE CARDIN shirt label melted into the iron. WHITE FLASH - back on Lenny...a tear. Julian sees his pain as he struggles."],["cue","JULIAN"],["dialogue","Pop...what is it?"],["cue","LENNY"],["dialogue","Julian - it's okay."],["cue","JULIAN"],["dialogue","I can't remember..."],["cue","LENNY"],["dialogue","Even if you did - it's not your fault."],["cue","JULIAN"],["dialogue","But if I did -"],["cue","LENNY"],["dialogue","You were 13 years old. If you did, you were pretending to be me. You loved me so much you wanted to be just like me."],["cue","JULIAN"],["paren","(crushed)"],["dialogue","Jesus Christ."],["cue","LENNY"],["dialogue","But you know what - if that's what happened - I let you stay up late that night - I could have made you go to bed like your mother told me. I yelled at you and scared you so if that’s what happened, maybe it wouldn’t have happened if I hadn’t yelled..."],["action","Julian is tearing up...."],["cue","JULIAN"],["dialogue","I'm so sorry, pop."],["cue","LENNY"],["dialogue","It was an accident."],["cue","JULIAN"],["dialogue","I'm so sorry...."],["cue","LENNY"],["dialogue","It's a tragic thing that happened, but it's okay..."],["action","Julian is crying and falls into his dad's arms who embraces him tightly."],["cue","LENNY  (CONT’D)"],["dialogue","It was an accident...it's okay...."],["action","Julian allows his father to comfort him in a sacred place and probably the only place this conversation could have unfolded. Crane shot up from the father and son to reveal the whole park as they slowly walk back to the car arm in arm. They share a smile."],["cue","LENNY  (CONT’D)"],["dialogue","Ya feel good about your decision to go to Wall Street? Last chance to piss Joanie off ya know..."],["action","Julian smiles."],["cue","JULIAN"],["dialogue","Yeah pop...I have a passion for it. I hope you understand...my journey just includes a different path. You still are my idol but I don't want to inherit what you created. I need to create my own empire."],["action","Lenny looks at his son, being honest."],["cue","LENNY"],["dialogue","I understand, kiddo."],["cue","JULIAN"],["dialogue","In a way this makes you actually more like my hero than if I just took the reins from you."],["action","Lenny is touched."],["cue","LENNY"],["dialogue","You're making me cry again, Jesus Christ. Knock it off."],["cue","JULIAN"],["dialogue","Are you crying cause I said you're my hero or you don't know how to run things without me?"],["cue","LENNY"],["dialogue","Sonny-boy, I was in business long before you...and I'll be in it long after you! No one's got my number."],["cue","JULIAN & LENNY"],["paren","(in unison)"],["dialogue","I got everyone's number."],["action","Father and son hug."],["cue","JULIAN (V.O.)"],["dialogue","And that folks...is where I got my whole schtick from."],["trans","FADE OUT."]]},{"id":"94","page":"109","pages":"109–110","slug":"EPILOGUE: INT. PARIS AIRPORT - DAY","ie":"INT","loc":"PARIS AIRPORT","time":"DAY","omitted":false,"summary":"Eight months later at Charles de Gaulle, Julian leaves Elin to fly to Los Angeles. To camera, he says he became a financial advisor, started a family and wears Gucci.","old":false,"lead":"","who":["Julian","Airport Announcer"],"el":[["action","SUPER: Charles de Gaulle Airport 8 Months Later: CU of a pen writing in the familiar Julian journal just finishing the following entry: 1968 - seems like forever ago. Looking back now, it really was one of the most turbulent years in American History. As we see the journal entry being written/completed we hear Julian’s V.O."],["cue","JULIAN (V.O.)"],["dialogue","1968 - seems like forever ago. Looking back now, it really was one of the most turbulent years in American History."],["action","Tilt up from a pair of dark brown Gucci loafers up to Julian in line to board a plane. He closes up the journal and pulls out his ticket as he looks into camera with his signature smile."],["cue","JULIAN"],["dialogue","You didn't think that was it, did you?"],["cue","AIRPORT ANNOUNCER (O.S.)"],["dialogue","Flight 818 going to Los Angeles at Gate 18."],["cue","JULIAN"],["dialogue","Unfortunately, I didn't live happily ever after in Paris with Elin. Come on. I was only 20!"],["action","Elin waves at Julian. Julian waves back then back to camera:"],["cue","JULIAN  (CONT’D)"],["dialogue","But can you blame me for trying? I mean - come on! She was Playmate of the Year!Truth is, I never saw any of my friends from my Gucci year again. I Google them from time to time. I became a financial advisor, managing several hundred million in assets. I started a family. But I haven’t forgotten those times. I wear Gucci now."],["action","Freeze frame on Julian smiling to camera and shrugging (like can you blame a guy?)"]]}]};

const $ = (s) => document.querySelector(s);
const list = $("#list"), q = $("#q");
const store = {
  get(k, d) { try { const v = localStorage.getItem("scriptreader." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("scriptreader." + k, JSON.stringify(v)); } catch (e) {} },
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fold = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[‘’]/g, "'").toLowerCase();
const CHEV = '<svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const scenes = DATA.scenes;
const live = scenes.filter((s) => !s.omitted);
let terms = [], showOmitted = store.get("omitted", false), size = store.get("size", 16), book = store.get("book", false);

// What a search can find: number, heading, summary, characters (head) and the scene text (body).
for (const s of scenes) {
  s.hayHead = fold([s.slug, s.summary, s.lead, s.who.join(" ")].join(" "));
  s.hayBody = fold(s.el.map((e) => e[1]).join(" "));
  s.level = 0;
}

const lastPage = String((scenes[scenes.length - 1] || {}).pages || "").split("–").pop();
$("#draft").textContent = [DATA.revision, live.length + " scenes", lastPage && lastPage + " pages"].filter(Boolean).join(" · ");
if (DATA.cast && DATA.cast.length) {
  $("#castlist").innerHTML = DATA.cast.map((c) => "<dt>" + esc(c.name) + "</dt><dd>" + esc(c.who) + "</dd>").join("");
  $("#cast").hidden = false;
}
$("#foot").innerHTML =
  "<p>Read from <span class='mono'>" + esc(DATA.script) + "</span> on " + esc(DATA.built) + ". Scene numbers, headings and text are the script's; the summaries are District Zero's notes, not the writers'.</p>" +
  "<p>Confidential: the production's screenplay, under NDA. For our team only: don't forward or upload it.</p>";

function mark(text) {
  // Escape the text and highlight the search words.
  if (!terms.length) return esc(text);
  const t = String(text), f = fold(t);
  const hits = [];
  for (const w of terms) {
    if (w.length < 2) continue;
    let i = 0;
    while ((i = f.indexOf(w, i)) !== -1) { hits.push([i, i + w.length]); i += w.length; }
  }
  if (!hits.length) return esc(t);
  hits.sort((a, b) => a[0] - b[0]);
  let out = "", at = 0;
  for (const [a, b] of hits) {
    if (a < at) continue;
    out += esc(t.slice(at, a)) + "<mark>" + esc(t.slice(a, b)) + "</mark>";
    at = b;
  }
  return out + esc(t.slice(at));
}

function headHtml(s) {
  if (s.omitted) {
    return '<div class="head"><span class="num">' + esc(s.id) + '</span><span class="slug"><span class="loc">Omitted</span></span><span class="right"><span class="pg">p. ' + esc(s.page) + "</span></span></div>";
  }
  const ie = s.ie ? '<span class="ie">' + esc(s.ie) + ". </span>" : "";
  const time = s.time ? '<span class="time"> – ' + esc(s.time) + "</span>" : "";
  const sub = s.who.length ? s.who.join(", ") : "No dialogue";
  return '<button class="head" type="button" aria-expanded="false" aria-controls="b' + esc(s.id) + '">' +
    '<span class="num">' + esc(s.id) + "</span>" +
    '<span class="slug"><span class="loc">' + ie + mark(s.loc || s.slug) + time + '</span><span class="sub">' + esc(sub) + "</span></span>" +
    '<span class="right"><span class="pg">p. ' + esc(s.pages) + '</span><span class="steps" aria-hidden="true"><i></i><i></i></span>' + CHEV + "</span></button>";
}

function summaryHtml(s) {
  const text = s.summary
    ? "<p>" + mark(s.summary) + (s.old ? ' <span class="tag" title="Written for an earlier draft of this scene">earlier draft</span>' : "") + "</p>"
    : '<p class="lead">' + mark(s.lead || "No action lines.") + "</p>";
  const found = terms.length && !matches(s, true) ? '<div class="meta"><span class="found">Found in the scene text</span></div>' : "";
  return text + found +
    '<div class="actions"><button class="read" type="button" data-act="full">Read the scene</button></div>';
}

function scriptHtml(s) {
  let out = '<p class="heading">' + esc(s.id) + "&nbsp;&nbsp;" + esc(s.slug) + "</p>";
  for (const [kind, text] of s.el) {
    const cls = kind === "slug" ? "slugline" : kind;
    out += '<p class="' + cls + '">' + mark(text) + "</p>";
  }
  return out + '<p class="end"><button class="read ghost" type="button" data-act="close">Close scene ' + esc(s.id) + "</button></p>";
}

function render() {
  const frag = document.createDocumentFragment();
  for (const s of scenes) {
    const li = document.createElement("li");
    li.className = "scene" + (s.omitted ? " omitted" : "");
    li.id = "s" + s.id;
    li.innerHTML = headHtml(s) + '<div class="body" id="b' + esc(s.id) + '"></div>';
    s.li = li;
    frag.appendChild(li);
  }
  list.appendChild(frag);
}

function setLevel(s, level, opts = {}) {
  if (s.omitted) return;
  s.level = level;
  const li = s.li, body = li.querySelector(".body"), head = li.querySelector(".head");
  li.classList.toggle("lvl1", level === 1);
  li.classList.toggle("lvl2", level === 2);
  head.setAttribute("aria-expanded", level > 0 ? "true" : "false");
  head.setAttribute("aria-label", "Scene " + s.id + (level === 0 ? ": show summary" : level === 1 ? ": read the scene" : ": close"));
  body.innerHTML = level === 0 ? "" :
    '<div class="summary">' + summaryHtml(s) + "</div>" + (level === 2 ? '<div class="script">' + scriptHtml(s) + "</div>" : "");
  if (level === 2) {
    const btn = body.querySelector('[data-act="full"]');
    if (btn) { btn.textContent = "Close the scene"; btn.dataset.act = "close"; btn.classList.add("ghost"); }
  }
  if (opts.scroll) keepInView(li, opts.scroll);
}

function keepInView(li, how) {
  const top = li.getBoundingClientRect().top, hdr = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hdr")) || 120;
  if (how === "always" || top < hdr || top > innerHeight * 0.7) li.scrollIntoView({ block: "start", behavior: "smooth" });
}

list.addEventListener("click", (e) => {
  const li = e.target.closest(".scene");
  if (!li) return;
  const s = scenes.find((x) => "s" + x.id === li.id);
  if (!s || s.omitted) return;
  const act = e.target.closest("[data-act]");
  if (act) {
    if (act.dataset.act === "full") setLevel(s, 2, { scroll: "maybe" });
    else { setLevel(s, 0); keepInView(li, "maybe"); }
    return;
  }
  if (!e.target.closest(".head")) return;
  const next = (s.level + 1) % 3;
  setLevel(s, next, { scroll: next === 1 ? undefined : "maybe" });
  remember(s);
});

function remember(s) {
  if (s.level > 0) history.replaceState(null, "", "#" + s.id);
}

// Search: a scene number (15, A62) jumps to that scene; anything else matches heading, summary, characters, then text.
const NUM = /^[a-z]?\d{1,3}[a-z]?$/i;
function matches(s, headOnly) {
  if (!terms.length) return true;
  const hay = headOnly ? s.hayHead : s.hayHead + " " + s.hayBody;
  return terms.every((w) => hay.includes(w));
}
function sameScene(id, raw) {
  // "15" finds 15, A15, B15, 15A; "A62" finds only A62.
  if (/[a-z]/i.test(raw)) return id.toLowerCase() === raw.toLowerCase();
  return id.replace(/[A-Z]/g, "") === raw;
}
function filter() {
  const raw = q.value.trim();
  $("#clear").hidden = !raw;
  let shown = 0;
  const numHit = NUM.test(raw) && scenes.some((s) => sameScene(s.id, raw));
  terms = raw && !numHit ? fold(raw).split(/\s+/).filter(Boolean) : [];
  for (const s of scenes) {
    const ok = numHit ? sameScene(s.id, raw) : (showOmitted || !s.omitted) && matches(s, false);
    s.li.hidden = !ok;
    if (ok && !s.omitted) shown++;
    // Redraw so the highlights follow the search (an omitted scene the number search finds shows too).
    s.li.querySelector(".head").outerHTML = headHtml(s);
    if (s.level) setLevel(s, s.level);
  }
  $("#empty").hidden = shown > 0 || scenes.some((s) => !s.li.hidden);
  $("#count").textContent = raw ? shown + " of " + live.length : "";
  $(".search").classList.toggle("has-q", !!raw);
  updateAll();
}
let timer;
q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(filter, 120); });
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const first = scenes.find((s) => !s.li.hidden && !s.omitted);
    if (first) { if (!first.level) setLevel(first, 1); keepInView(first.li, "always"); q.blur(); }
  }
  if (e.key === "Escape") { q.value = ""; filter(); }
});
$("#clear").addEventListener("click", () => { q.value = ""; filter(); q.focus(); });

function updateAll() {
  const visible = scenes.filter((s) => !s.li.hidden && !s.omitted);
  const anyOpen = visible.some((s) => s.level > 0);
  $("#all").textContent = anyOpen ? "Close all" : "Open all";
}
$("#all").addEventListener("click", () => {
  const visible = scenes.filter((s) => !s.li.hidden && !s.omitted);
  const anyOpen = visible.some((s) => s.level > 0);
  for (const s of visible) setLevel(s, anyOpen ? 0 : 1);
  updateAll();
});
list.addEventListener("click", updateAll);

$("#omit").addEventListener("click", () => {
  showOmitted = !showOmitted;
  store.set("omitted", showOmitted);
  $("#omit").setAttribute("aria-pressed", String(showOmitted));
  filter();
});

function applyBook() {
  document.body.classList.toggle("book", book);
  $("#book").setAttribute("aria-pressed", String(book));
}
$("#book").addEventListener("click", () => { book = !book; store.set("book", book); applyBook(); });
function applySize() {
  document.documentElement.style.setProperty("--script-size", size + "px");
  $("#smaller").disabled = size <= 13;
  $("#bigger").disabled = size >= 22;
}
$("#smaller").addEventListener("click", () => { size = Math.max(13, size - 1); store.set("size", size); applySize(); });
$("#bigger").addEventListener("click", () => { size = Math.min(22, size + 1); store.set("size", size); applySize(); });

// The sticky header's height, so an open scene's heading sticks just under it.
const topBar = $("#top");
const setHdr = () => document.documentElement.style.setProperty("--hdr", topBar.offsetHeight + "px");
if ("ResizeObserver" in window) new ResizeObserver(setHdr).observe(topBar);
addEventListener("resize", setHdr);

function openHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  const s = scenes.find((x) => x.id.toLowerCase() === id.toLowerCase());
  if (!s || s.omitted) return;
  s.li.hidden = false;
  if (!s.level) setLevel(s, 1);
  setTimeout(() => s.li.scrollIntoView({ block: "start" }), 0);     // a link jumps straight there
}
addEventListener("hashchange", openHash);

render();
$("#omit").setAttribute("aria-pressed", String(showOmitted));
applySize();
applyBook();
setHdr();
filter();
openHash();
</script>
</body>
</html>
